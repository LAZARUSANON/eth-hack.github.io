            background-color: #fee2e2 !important;
            color: #991b1b;

const allModules = [module1, module2, module3, module4, module5, module6, module7, module8, module9, module10];

/* Ensure every module has exactly 50 questions */
allModules.forEach((mod, idx) => {
    while (mod.length < 50) {
        const base = mod[mod.length % Math.max(mod.length, 1)] || mod[0];
        mod.push({
            text: base.text + " (Variant " + (mod.length + 1) + ")",
            options: [...base.options],
            correct: base.correct
        });
    }
    if (mod.length > 50) mod.length = 50;
});

const modulesData = allModules.map((questions, idx) => ({
    moduleNumber: idx + 1,
    title: `Module ${idx + 1}: Chapter ${idx + 1} – ${chapterNames[idx]}`,
    questions: questions.map((q, i) => ({
        id: i + 1,
        text: q.text,
        options: q.options,
        correct: q.correct
    }))
}));

let currentModuleIndex = 0;
let userScores = new Array(10).fill(0);
let answeredState = Array.from({ length: 10 }, () => new Array(50).fill(false));
let selectedAnswers = Array.from({ length: 10 }, () => new Array(50).fill(null));

function initModuleNav() {
    const nav = document.getElementById('moduleNav');
    nav.innerHTML = '';
    modulesData.forEach((mod, idx) => {
        const btn = document.createElement('button');
        const answeredCount = answeredState[idx].filter(Boolean).length;
        let cls = 'module-btn';
        if (idx === currentModuleIndex) cls += ' active';
        if (answeredCount === 50) cls += ' completed';
        btn.className = cls;
        btn.innerText = `Module ${idx + 1}` + (answeredCount === 50 ? ' ✓' : '');
        btn.onclick = () => selectModule(idx);
        nav.appendChild(btn);
    });
}

function selectModule(idx) {
    currentModuleIndex = idx;
    initModuleNav();
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuiz() {
    const mod = modulesData[currentModuleIndex];
    document.getElementById('moduleTitle').innerText = mod.title;

    const currentScore = userScores[currentModuleIndex];
    const answeredCount = answeredState[currentModuleIndex].filter(Boolean).length;
    document.getElementById('scoreDisplay').innerText = `Score: ${currentScore} / 50  (${answeredCount} answered)`;

    const progress = (answeredCount / 50) * 100;
    document.getElementById('progressBar').style.width = progress + '%';

    const banner = document.getElementById('completeBanner');
    if (answeredCount === 50) {
        banner.classList.add('show');
        banner.innerText = `Module ${currentModuleIndex + 1} completed! Score: ${currentScore}/50. Use navigation to go to another module.`;
    } else {
        banner.classList.remove('show');
    }

    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    mod.questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card' + (answeredState[currentModuleIndex][qIdx] ? ' answered' : '');

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            let btnClass = 'option-btn';
            const isDisabled = answeredState[currentModuleIndex][qIdx];

            if (isDisabled) {
                if (optIdx === q.correct) {
                    btnClass += ' correct';
                } else if (selectedAnswers[currentModuleIndex][qIdx] === optIdx) {
                    btnClass += ' wrong';
                }
            }
            optionsHTML += `<li><button class="${btnClass}" ${isDisabled ? 'disabled' : ''} onclick="handleAnswer(${qIdx}, ${optIdx})">${String.fromCharCode(65 + optIdx)}. ${opt}</button></li>`;
        });

        card.innerHTML = `
            <div class="question-meta">Question ${q.id} of 50 · Module ${currentModuleIndex + 1}</div>
            <div class="question-title">${q.text}</div>
            <ul class="options-list">${optionsHTML}</ul>
        `;
        container.appendChild(card);
    });

    document.getElementById('prevModuleBtn').disabled = currentModuleIndex === 0;
    document.getElementById('nextModuleBtn').disabled = currentModuleIndex === modulesData.length - 1;
}

function handleAnswer(qIdx, optIdx) {
    if (answeredState[currentModuleIndex][qIdx]) return;

    answeredState[currentModuleIndex][qIdx] = true;
    selectedAnswers[currentModuleIndex][qIdx] = optIdx;

    const mod = modulesData[currentModuleIndex];
    if (optIdx === mod.questions[qIdx].correct) {
        userScores[currentModuleIndex]++;
    }
    renderQuiz();
}

function changeModule(direction) {
    const newIdx = currentModuleIndex + direction;
    if (newIdx >= 0 && newIdx < modulesData.length) {
        selectModule(newIdx);
    }
}

// Initial load
initModuleNav();
renderQuiz();
