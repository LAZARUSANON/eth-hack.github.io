        .question-card {
            margin-bottom: 25px;
            padding: 20px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;

        }
        .question-title {

            font-weight: bold;

        }
        .citation {

            color: #7f8c8d;

        }
        .options {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        .options li {
            margin-bottom: 10px;
        }
        .option-btn {
            width: 100%;
            text-align: left;
            padding: 10px 15px;
            border: 1px solid #bdc3c7;
            border-radius: 4px;
            background: #fff;
            cursor: pointer;
            transition: all 0.2s ease;
            font-size: 1em;
        }
        .option-btn:hover:not(:disabled) {
            background: #ecf0f1;
        }
        .option-btn.correct {
            background-color: #2ecc71 !important;
            color: white;
            border-color: #27ae60;
        }
        .option-btn.wrong {
            background-color: #e74c3c !important;
            color: white;
            border-color: #c0392b;
        }
        .option-btn:disabled {
            cursor: not-allowed;

let score = 0;

function loadQuiz() {
    const container = document.getElementById('quizContainer');
    container.innerHTML = '';

    quizData.forEach((item, index) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        const citation = document.div;
        
        let optionsHTML = '';
        item.options.forEach((opt, optIndex) => {
            optionsHTML += `<li><button class="option-btn" onclick="checkAnswer(this, ${index}, ${optIndex})">${opt}</button></li>`;
        });

        card.innerHTML = `
            <div class="citation">Source Reference: ${item.section}</div>
            <div class="question-title">Q${index + 1}: ${item.q}</div>
            <ul class="options">${optionsHTML}</ul>
        `;
        container.appendChild(card);
    });
}

function checkAnswer(button, qIndex, selectedOptIndex) {
    const questionObj = quizData[qIndex];
    const parentList = button.parentElement.parentElement;
    const buttons = parentList.getElementsByTagName('button');

    // Disable all options for this question once chosen
    for (let btn of buttons) {
        btn.disabled = true;
    }

    if (selectedOptIndex === questionObj.correct) {
        button.classList.add('correct');
        score++;
    } else {
        button.classList.add('wrong');
        // Highlight the correct answer
        buttons[questionObj.correct].classList.add('correct');
    }

    document.getElementById('scoreBoard').innerText = `Score: ${score} / ${quizData.length}`;
}

// Initialize quiz on load
