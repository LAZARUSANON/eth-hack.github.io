let currentModuleIndex = 0;
let userScores = new Array(10).fill(0);
let answeredState = Array.from({ length: 10 }, () => new Array(5).fill(false));
let selectedAnswers = Array.from({ length: 10 }, () => new Array(5).fill(null));

function initModuleNav() {
    const nav = document.getElementById('moduleNav');
    nav.innerHTML = '';
    modulesData.forEach((mod, idx) => {
        const btn = document.createElement('button');
        btn.className = `module-btn ${idx === currentModuleIndex ? 'active' : ''}`;
        btn.innerText = `Module ${idx + 1}`;
        btn.onclick = () => selectModule(idx);
        nav.appendChild(btn);
    });
}

function selectModule(idx) {
    currentModuleIndex = idx;
    initModuleNav();
    renderQuiz();
}

function renderQuiz() {
    const mod = modulesData[currentModuleIndex];
    document.getElementById('moduleTitle').innerText = mod.title;
    
    const currentScore = userScores[currentModuleIndex];
    document.getElementById('scoreDisplay').innerText = `Module Score: ${currentScore} / 5`;
    
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    
    mod.questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        
        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            let btnClass = 'option-btn';
            let isDisabled = answeredState[currentModuleIndex][qIdx];
            
            if (isDisabled) {
                if (optIdx === q.correct) {
                    btnClass += ' correct';
                } else if (selectedAnswers[currentModuleIndex][qIdx] === optIdx) {
                    btnClass += ' wrong';
                }
            }
            optionsHTML += `<li><button class="${btnClass}" ${isDisabled ? 'disabled' : ''} onclick="handleAnswer(${qIdx}, ${optIdx})">${String.fromCharCode(65 + optIdx)}. ${opt}</button></li>`;
        });
        
        const showExplanation = answeredState[currentModuleIndex][qIdx];
        const explanationClass = showExplanation ? 'explanation show' : 'explanation';
        
        card.innerHTML = `
            <div class="question-meta">Question ${q.id} of 5 · Module ${mod.moduleNumber}</div>
            <div class="question-title">${q.text}</div>
            <ul class="options-list">${optionsHTML}</ul>
            <div class="${explanationClass}" id="expl-${currentModuleIndex}-${qIdx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });
    
    document.getElementById('prevModuleBtn').disabled = currentModuleIndex === 0;
    document.getElementById('nextModuleBtn').disabled = currentModuleIndex === modulesData.length - 1;
}

function handleAnswer(qIdx, optIdx) {
    if (answeredState[currentModuleIndex][qIdx]) return;
    
    answeredState[currentModuleIndex][qIdx] = true;
    selectedAnswers[currentModuleIndex][qIdx] = optIdx;
    
    const mod = modulesData[currentModuleIndex];
    if (optIdx === mod.questions[qIdx].correct) {
        userScores[currentModuleIndex]++;
    }
    
    renderQuiz();
}

function changeModule(direction) {
    const newIdx = currentModuleIndex + direction;
    if (newIdx >= 0 && newIdx < modulesData.length) {
        selectModule(newIdx);
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }
}

// Initial load
initModuleNav();
renderQuiz();
</script>
