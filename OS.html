<script>
const modulesData = [{"moduleNumber": 1, "title": "Chapter 1: General Introduction", "questions": [{"id": 1, "text": "What is the primary role of an operating system?", "options": ["To replace the BIOS completely", "To design computer hardware circuits", "To only provide a graphical interface", "To manage hardware resources and provide a platform for applications"], "correct": 3, "explanation": "The OS acts as an intermediary between hardware and software, managing CPU, memory, storage and I/O."}, {"id": 2, "text": "Which component of the OS runs in the most privileged CPU mode?", "options": ["Web browsers", "Device drivers written in user space", "The kernel", "User applications"], "correct": 2, "explanation": "The kernel executes in kernel mode (ring 0) and has unrestricted access to hardware."}, {"id": 3, "text": "How do ordinary programs request services from the OS kernel?", "options": ["By writing directly to hardware ports", "By sending network packets to localhost", "By modifying kernel memory", "By making system calls"], "correct": 3, "explanation": "System calls are the controlled interface that switches the CPU from user mode to kernel mode."}, {"id": 4, "text": "What is the main security benefit of separating user mode from kernel mode?", "options": ["It makes the computer boot faster", "It increases the amount of available RAM", "It prevents untrusted code from directly accessing critical hardware and kernel data", "It allows every program to run as administrator"], "correct": 2, "explanation": "Privilege separation is a fundamental isolation mechanism that limits the damage a buggy or malicious program can cause."}, {"id": 5, "text": "Process isolation means that:", "options": ["All processes share the exact same address space", "Every process runs with root privileges", "Virtual memory is disabled", "One process cannot read or write the memory of another process without explicit permission"], "correct": 3, "explanation": "Isolation contains faults and limits the impact of a compromised process."}, {"id": 6, "text": "The three classic goals of information security are known as:", "options": ["Confidentiality, Integrity and Authentication", "Confidentiality, Identification and Authorization", "Cryptography, Integrity and Availability", "Confidentiality, Integrity and Availability (the CIA triad)"], "correct": 3, "explanation": "CIA is the foundational model used to evaluate security requirements."}, {"id": 7, "text": "What is threat modeling?", "options": ["Installing antivirus software", "Writing firewall rules only", "A structured process to identify potential attackers, their goals and the attack paths they might use", "Compiling the kernel with debug symbols"], "correct": 2, "explanation": "Threat modeling helps prioritise defences by understanding who might attack and how."}, {"id": 8, "text": "The attack surface of a system is:", "options": ["The physical size of the server room", "The amount of free disk space", "The set of all points where an attacker can try to enter or extract data", "The number of logged-in users"], "correct": 2, "explanation": "Reducing the attack surface (closing ports, removing software, limiting privileges) is a core hardening principle."}, {"id": 9, "text": "Which of the following is NOT typically considered a type of attacker?", "options": ["A legitimate system administrator performing authorised maintenance", "Nation-state actors", "Script kiddies", "Malicious insiders"], "correct": 0, "explanation": "Authorised administrators are not attackers; the other categories represent different threat actors."}, {"id": 10, "text": "Why is OS security important?", "options": ["Because the OS never handles user data", "Because security is only a network concern", "Because the OS controls access to all hardware and software resources on a computer", "Because the OS is only responsible for the desktop wallpaper"], "correct": 2, "explanation": "A compromised OS can lead to complete loss of confidentiality, integrity and availability of the system."}, {"id": 11, "text": "Which statement best describes a system call?", "options": ["A function that always runs in user mode", "An interrupt generated only by hardware timers", "A network packet used for remote login", "A controlled entry point from user mode into the kernel"], "correct": 3, "explanation": "System calls provide the safe interface applications use to request privileged services."}, {"id": 12, "text": "What does the term 'privilege level' or 'ring' refer to in OS security?", "options": ["The colour depth of the display", "The size of the page cache", "The number of CPU cores", "Hardware-enforced modes that restrict what code is allowed to do"], "correct": 3, "explanation": "Modern CPUs support multiple privilege rings; the OS uses them to isolate the kernel from applications."}, {"id": 13, "text": "An example of reducing the attack surface is:", "options": ["Giving all users administrator rights", "Opening every possible network port", "Disabling or uninstalling unused network services", "Running every service as root"], "correct": 2, "explanation": "Fewer running services and open ports mean fewer ways for an attacker to get in."}, {"id": 14, "text": "What is the difference between a monolithic kernel and a microkernel regarding security?", "options": ["Microkernels cannot support device drivers", "There is no security difference", "A monolithic kernel is always more secure", "A microkernel keeps most services in user space, reducing the size of the trusted computing base"], "correct": 3, "explanation": "Smaller TCBs are easier to verify and contain fewer potential vulnerabilities."}, {"id": 15, "text": "Which of the following is a key function of the OS related to security?", "options": ["Enforcing access control and protecting process memory", "Choosing the desktop theme", "Setting the system volume level", "Deciding the brand of the hard drive"], "correct": 0, "explanation": "Access control and memory protection are core security responsibilities of the OS."}, {"id": 16, "text": "When a user-mode program tries to execute a privileged instruction, what typically happens?", "options": ["The program is given permanent root access", "The CPU raises an exception and control is transferred to the kernel", "The computer immediately shuts down", "The instruction executes successfully"], "correct": 1, "explanation": "Hardware enforces the privilege boundary; illegal instructions cause a trap into the kernel."}, {"id": 17, "text": "What is the Trusted Computing Base (TCB)?", "options": ["Only the web browser", "Only the network cable", "Only user applications", "The set of all components (hardware, firmware, software) critical to the security of the system"], "correct": 3, "explanation": "Anything outside the TCB is considered untrusted; the TCB must be protected and kept as small as practical."}, {"id": 18, "text": "Why should the TCB be kept small?", "options": ["A larger TCB is always more secure", "The TCB should include every application", "A smaller TCB is easier to verify, test and protect", "Size of the TCB has no security impact"], "correct": 2, "explanation": "Reducing the TCB reduces the number of components that must be trusted."}, {"id": 19, "text": "Which of the following best describes 'least privilege'?", "options": ["Running all code in kernel mode", "Disabling all security checks", "Giving every user full administrator rights", "Giving every subject only the minimum rights needed to perform its authorised tasks"], "correct": 3, "explanation": "Least privilege limits the damage that can be caused by a compromised or buggy component."}, {"id": 20, "text": "Defence in depth means:", "options": ["Layering multiple independent security controls so that the failure of one does not compromise the whole system", "Relying on a single firewall", "Using only passwords", "Disabling logging"], "correct": 0, "explanation": "Multiple layers increase the effort an attacker must expend to succeed."}, {"id": 21, "text": "What is the main purpose of a system call interface?", "options": ["To provide a stable, controlled way for user programs to request kernel services", "To disable hardware interrupts", "To increase the clock speed of the CPU", "To allow user programs to modify the kernel at will"], "correct": 0, "explanation": "A well-designed system-call interface is essential for both functionality and security."}, {"id": 22, "text": "Which of the following is an example of an external threat actor?", "options": ["A remote attacker scanning the internet for vulnerable services", "A user changing their own password", "A developer writing legitimate application code", "A system administrator applying a security patch"], "correct": 0, "explanation": "External actors do not already have legitimate access to the system."}, {"id": 23, "text": "An insider threat is dangerous because:", "options": ["Insiders never have any privileges", "Insiders are always detected immediately", "Insiders cannot access any data", "The insider already possesses some level of authorised access"], "correct": 3, "explanation": "Existing access makes it easier for a malicious or careless insider to cause damage."}, {"id": 24, "text": "What does 'complete mediation' require?", "options": ["That only write accesses are checked", "That no accesses are ever checked", "That every access to every object is checked against the security policy", "That only the first access is checked"], "correct": 2, "explanation": "Complete mediation is one of the classic Saltzer & Schroeder secure-design principles."}, {"id": 25, "text": "Fail-safe defaults means:", "options": ["All users start with administrator rights", "Access is denied unless explicitly permitted", "Access is permitted unless explicitly denied", "Security features are disabled by default"], "correct": 1, "explanation": "Fail-safe defaults reduce the chance that a misconfiguration leaves a resource unprotected."}, {"id": 26, "text": "Economy of mechanism advises that:", "options": ["Security mechanisms should be as complex as possible", "Security mechanisms should be secret", "Security mechanisms should be as simple and small as possible", "Security should be implemented only in hardware"], "correct": 2, "explanation": "Simple mechanisms are easier to understand, verify and implement correctly."}, {"id": 27, "text": "Open design (as a security principle) means:", "options": ["Security through obscurity is the best approach", "Only proprietary software can be secure", "The source code must be kept completely secret", "The design should not depend on secrecy of the mechanism itself"], "correct": 3, "explanation": "Security should rely on the strength of keys or configuration, not on keeping the algorithm secret."}, {"id": 28, "text": "What is the difference between a vulnerability and a threat?", "options": ["They are exactly the same thing", "Vulnerabilities only exist in hardware", "A vulnerability is a weakness; a threat is a potential cause of an unwanted incident", "A threat is a weakness; a vulnerability is an attacker"], "correct": 2, "explanation": "Understanding the distinction helps in risk assessment and prioritisation."}, {"id": 29, "text": "Which of the following is a common OS attack method?", "options": ["Selecting a different font", "Changing the desktop wallpaper", "Exploiting a buffer overflow in a privileged service", "Adjusting the system volume"], "correct": 2, "explanation": "Memory-corruption bugs in privileged code are a classic and still relevant attack vector."}, {"id": 30, "text": "Why is it important to keep the OS and applications patched?", "options": ["Patches fix known vulnerabilities that attackers actively exploit", "Patches only improve performance", "Patches are never related to security", "Unpatched systems are always more secure"], "correct": 0, "explanation": "Unpatched systems are among the most common causes of successful compromises."}, {"id": 31, "text": "What is the role of the bootloader in OS security?", "options": ["It has no security relevance", "It loads the OS kernel and can be a target for bootkits if not protected", "It permanently stores user passwords", "It only displays a graphical splash screen"], "correct": 1, "explanation": "Secure Boot and measured boot help protect the boot process from tampering."}, {"id": 32, "text": "A 'script kiddie' is best described as:", "options": ["An attacker with limited skill who uses ready-made tools written by others", "A system administrator", "A professional penetration tester", "A highly skilled nation-state operator"], "correct": 0, "explanation": "Script kiddies still pose a real risk because automated tools can be very effective against unpatched systems."}, {"id": 33, "text": "What is the main goal of OS hardening?", "options": ["To reduce the attack surface and make successful exploitation more difficult", "To install as many services as possible", "To give every user administrator rights", "To disable all logging"], "correct": 0, "explanation": "Hardening is a continuous process of configuration and minimisation."}, {"id": 34, "text": "Which statement about virtual memory is true from a security perspective?", "options": ["It forces all processes to share the same physical memory", "It removes the need for access control", "It provides each process with its own isolated address space", "It disables memory protection"], "correct": 2, "explanation": "Virtual memory is a fundamental building block of process isolation."}, {"id": 35, "text": "What happens if two processes are allowed to write to the same memory location without synchronisation or permission checks?", "options": ["The system becomes faster", "Security is automatically improved", "Data corruption or security breaches can occur", "Nothing negative can happen"], "correct": 2, "explanation": "Uncontrolled sharing breaks isolation and can lead to integrity and confidentiality problems."}, {"id": 36, "text": "The principle of 'separation of duties' is intended to:", "options": ["Allow one administrator to do everything", "Remove all audit logs", "Disable authentication", "Prevent any single person from having unchecked power over a critical process"], "correct": 3, "explanation": "Separation of duties reduces the risk of fraud and abuse of privilege."}, {"id": 37, "text": "Which of the following is part of the OS security architecture?", "options": ["The colour scheme of the desktop", "The mechanisms that enforce the system's security policy", "The brand of the monitor", "The choice of programming language for applications"], "correct": 1, "explanation": "Security architecture encompasses the design of the TCB, reference monitor, and related controls."}, {"id": 38, "text": "Why are device drivers a special security concern?", "options": ["They often run with high privileges and interact directly with hardware", "They only run in user mode", "They never have any privileges", "They cannot contain bugs"], "correct": 0, "explanation": "A vulnerable driver can be used to escalate privileges or compromise the kernel."}, {"id": 39, "text": "What is the purpose of a security policy in an OS?", "options": ["To choose the desktop background", "To define the rules that determine which subjects may access which objects", "To decide the CPU frequency", "To set the system clock"], "correct": 1, "explanation": "Policies express the security goals; mechanisms enforce them."}, {"id": 40, "text": "Which of the following best describes 'accountability' in OS security?", "options": ["The ability to run without authentication", "The ability to hide all user actions", "The ability to disable logging", "The ability to determine which user or process performed a particular action"], "correct": 3, "explanation": "Accountability depends on reliable identification, authentication and audit trails."}, {"id": 41, "text": "An example of a security mechanism is:", "options": ["The physical colour of the server chassis", "A marketing brochure", "An access-control list that the kernel consults before allowing a file open", "A user training manual only"], "correct": 2, "explanation": "Mechanisms are the technical controls that implement policy."}, {"id": 42, "text": "What is the relationship between authentication and authorisation?", "options": ["Authorisation always happens before authentication", "They are the same thing", "Authentication establishes identity; authorisation decides what that identity is allowed to do", "Neither is needed in a secure OS"], "correct": 2, "explanation": "Both are required; authentication without authorisation (or vice versa) leaves gaps."}, {"id": 43, "text": "Why is logging important for OS security?", "options": ["Logs are only useful for performance tuning", "Logs only slow the system down and have no security value", "Logs should be deleted immediately", "Logs provide evidence of actions that can be used for detection and investigation"], "correct": 3, "explanation": "Without logs it is very difficult to detect or investigate security incidents."}, {"id": 44, "text": "Which of the following is a sign of a well-designed security architecture?", "options": ["There are no audit trails", "The security mechanisms are simple, well-documented and difficult to bypass", "Every user runs as root for convenience", "Security depends entirely on keeping the source code secret"], "correct": 1, "explanation": "Good architecture follows established principles such as least privilege, complete mediation and economy of mechanism."}, {"id": 45, "text": "What is the main risk of running unnecessary services?", "options": ["Unnecessary services always improve performance", "Each service increases the attack surface and may contain vulnerabilities", "Unnecessary services automatically harden the system", "Unnecessary services have no security impact"], "correct": 1, "explanation": "Minimising running services is one of the simplest and most effective hardening steps."}, {"id": 46, "text": "In the context of OS security, 'subjects' are typically:", "options": ["Network cables", "Active entities such as users or processes that request access to objects", "The power supply unit", "Passive data files only"], "correct": 1, "explanation": "The subject–object model is fundamental to access-control discussions."}, {"id": 47, "text": "'Objects' in access-control terminology are:", "options": ["Only network packets", "Only the users of the system", "Only the kernel itself", "Passive entities such as files, memory regions or devices that are acted upon"], "correct": 3, "explanation": "Access-control decisions determine whether a subject may perform an operation on an object."}, {"id": 48, "text": "What is the benefit of using a reference monitor?", "options": ["It allows every process to access every object", "It disables all security checks", "It provides a single, consistent point that mediates all access attempts", "It only works on Windows"], "correct": 2, "explanation": "The reference-monitor concept is central to the design of high-assurance systems."}, {"id": 49, "text": "Which of the following statements about OS security is TRUE?", "options": ["Default configurations are always the most secure", "Security must be designed into the system from the beginning; it is hard to add effectively later", "Security can always be bolted on after the system is finished", "Security is only a concern for network devices"], "correct": 1, "explanation": "Secure design principles emphasise building security in rather than adding it as an afterthought."}, {"id": 50, "text": "A practical first step when securing a newly installed OS is to:", "options": ["Immediately open all network ports", "Create many administrator accounts", "Disable the firewall and logging", "Apply all available security updates and remove or disable unnecessary services"], "correct": 3, "explanation": "Patching and minimising the attack surface are high-value early actions."}]}, {"moduleNumber": 2, "title": "Chapter 2: The Three Security Goals – Confidentiality, Integrity & Availability", "questions": [{"id": 1, "text": "Confidentiality primarily protects against:", "options": ["Hardware failure", "Unauthorised modification of data", "Denial of service", "Unauthorised disclosure of information"], "correct": 3, "explanation": "Confidentiality ensures that only authorised parties can read sensitive data."}, {"id": 2, "text": "Integrity is violated when:", "options": ["Data is read by an unauthorised party", "A user changes their own password", "A service becomes temporarily unavailable", "Data is modified by an unauthorised party"], "correct": 3, "explanation": "Integrity protects the accuracy and completeness of data and system state."}, {"id": 3, "text": "Availability is threatened by:", "options": ["Denial-of-service attacks and resource exhaustion", "Only by strong passwords", "Only by access-control lists", "Only by encryption"], "correct": 0, "explanation": "Availability ensures authorised users can obtain the services they need when they need them."}, {"id": 4, "text": "The CIA triad is useful because:", "options": ["It provides a simple framework for analysing the security requirements of any system", "It only applies to network security", "It is only relevant to military systems", "It replaces the need for any technical controls"], "correct": 0, "explanation": "Almost every security control can be mapped to one or more of the three goals."}, {"id": 5, "text": "Which formal model is primarily concerned with confidentiality?", "options": ["Chinese Wall only", "Bell-LaPadula", "Clark-Wilson", "Biba"], "correct": 1, "explanation": "Bell-LaPadula enforces 'no read up, no write down' to protect multilevel confidentiality."}, {"id": 6, "text": "Which formal model is primarily concerned with integrity?", "options": ["Biba", "Only RBAC", "Bell-LaPadula", "Only the Chinese Wall model"], "correct": 0, "explanation": "Biba enforces 'no read down, no write up' to protect integrity."}, {"id": 7, "text": "The Clark-Wilson model focuses on:", "options": ["Well-formed transactions and separation of duties to protect commercial integrity", "Only multilevel military confidentiality", "Only network routing", "Only password strength"], "correct": 0, "explanation": "Clark-Wilson is well suited to business environments where data integrity is critical."}, {"id": 8, "text": "A threat model should identify:", "options": ["Only the brand of the firewall", "Only the colour of the server room", "Only the number of CPU cores", "Potential adversaries, their capabilities, goals and the assets they might target"], "correct": 3, "explanation": "Good threat models guide the selection and prioritisation of countermeasures."}, {"id": 9, "text": "Reducing the attack surface typically improves:", "options": ["Only integrity", "Only availability", "Only confidentiality", "All three aspects of the CIA triad by removing unnecessary entry points"], "correct": 3, "explanation": "Fewer attack points mean fewer opportunities for disclosure, modification or disruption."}, {"id": 10, "text": "An example of a control that primarily supports confidentiality is:", "options": ["A load balancer", "Encryption of data at rest and in transit", "A disk-mirroring configuration", "A redundant power supply"], "correct": 1, "explanation": "Encryption prevents unauthorised parties from reading the data even if they obtain a copy."}, {"id": 11, "text": "An example of a control that primarily supports integrity is:", "options": ["A larger hard disk", "A faster CPU", "More RAM", "Cryptographic hashes or digital signatures that detect modification"], "correct": 3, "explanation": "Integrity controls detect or prevent unauthorised changes."}, {"id": 12, "text": "An example of a control that primarily supports availability is:", "options": ["More detailed audit logs", "Longer encryption keys", "Redundant servers and regular backups", "Stronger password hashing"], "correct": 2, "explanation": "Redundancy and recovery mechanisms keep services usable even when components fail or are attacked."}, {"id": 13, "text": "Why can the three CIA goals sometimes conflict?", "options": ["They never conflict", "Conflicts only occur in network protocols", "Strong confidentiality or integrity controls can reduce usability or performance and therefore availability", "They always reinforce each other perfectly"], "correct": 2, "explanation": "Security design often requires balancing the three goals according to the needs of the system."}, {"id": 14, "text": "In the context of OS security, a common threat to integrity is:", "options": ["A buffer-overflow exploit that allows an attacker to modify process memory", "A user reading a public web page", "A scheduled system update", "A correctly functioning backup system"], "correct": 0, "explanation": "Memory-corruption attacks can alter both code and data, violating integrity."}, {"id": 15, "text": "Which of the following best describes an attack surface?", "options": ["The amount of free disk space", "All the ways an adversary can try to interact with or attack a system", "The number of users currently logged in", "The physical perimeter of a data centre only"], "correct": 1, "explanation": "Attack surface includes network ports, APIs, user interfaces, physical ports, etc."}, {"id": 16, "text": "OS threat modelling should consider:", "options": ["Only the brand of the keyboard", "Only the desktop wallpaper", "Kernel interfaces, system calls, drivers, privilege boundaries and user-facing services", "Only the room temperature"], "correct": 2, "explanation": "OS-specific threat models focus on the unique interfaces and trust boundaries of the operating system."}, {"id": 17, "text": "A key strategy for protecting confidentiality in an OS is:", "options": ["Disabling all access controls", "Making every file world-readable", "Strong access control combined with encryption of sensitive data", "Turning off the firewall"], "correct": 2, "explanation": "Access control limits who can read data; encryption protects data even if access control is bypassed."}, {"id": 18, "text": "A key strategy for protecting integrity in an OS is:", "options": ["Removing all digital signatures", "Allowing every process to write anywhere", "Disabling all logging", "Write-protecting critical system files and using integrity-checking tools"], "correct": 3, "explanation": "Protecting the integrity of the TCB itself is especially important."}, {"id": 19, "text": "A key strategy for protecting availability in an OS is:", "options": ["Resource limits, process isolation and protection against resource-exhaustion attacks", "Disabling the scheduler", "Removing all process limits", "Allowing any process to consume unlimited memory"], "correct": 0, "explanation": "Without resource controls a single process can deny service to everyone else."}, {"id": 20, "text": "Which of the following is a classic example of a confidentiality breach?", "options": ["An attacker changing a web-page price", "An attacker reading another user's private files", "An attacker flooding a server with traffic", "A hard-disk failure"], "correct": 1, "explanation": "Reading data without authorisation violates confidentiality."}, {"id": 21, "text": "Which of the following is a classic example of an integrity breach?", "options": ["A temporary network outage", "An attacker reading a public document", "A user logging out", "An attacker changing the contents of a system configuration file"], "correct": 3, "explanation": "Unauthorised modification violates integrity."}, {"id": 22, "text": "Which of the following is a classic example of an availability breach?", "options": ["An attacker reading an encrypted file without the key", "A successful login", "A ransomware attack that encrypts files and prevents legitimate access", "A user changing their own password"], "correct": 2, "explanation": "Preventing legitimate access violates availability."}, {"id": 23, "text": "The 'need-to-know' principle supports which CIA goal most directly?", "options": ["Integrity only", "None of the CIA goals", "Confidentiality", "Availability only"], "correct": 2, "explanation": "Need-to-know limits the distribution of sensitive information."}, {"id": 24, "text": "Non-repudiation is closely related to which security goal?", "options": ["Only availability", "Integrity and accountability (being able to prove that an action occurred)", "Only performance", "Only confidentiality"], "correct": 1, "explanation": "Non-repudiation ensures that a party cannot deny having performed an action."}, {"id": 25, "text": "Why are integrity models important for operating systems?", "options": ["They are only used for printing", "They provide formal rules that can be enforced to prevent unauthorised modification of critical data", "They only improve network speed", "They replace the need for authentication"], "correct": 1, "explanation": "Formal models allow rigorous reasoning about whether a system preserves integrity."}, {"id": 26, "text": "An availability model might quantify:", "options": ["Only the number of user accounts", "Only the colour of the server", "Only the strength of encryption keys", "Expected uptime, mean time between failures and recovery time objectives"], "correct": 3, "explanation": "Availability models help design systems that meet business continuity requirements."}, {"id": 27, "text": "Which of the following is a practical way to improve all three CIA properties?", "options": ["Giving every process full privileges", "Removing all audit logs", "Disabling all security features", "Applying the principle of least privilege throughout the system"], "correct": 3, "explanation": "Least privilege reduces the chance of unauthorised disclosure, modification and disruption."}, {"id": 28, "text": "When evaluating a new security control, you should ask:", "options": ["Only whether it looks modern", "Only whether it is expensive", "Only whether it is open source", "Which aspects of CIA it improves and whether it introduces new risks to the other aspects"], "correct": 3, "explanation": "Security is about trade-offs; every control has costs and potential side-effects."}, {"id": 29, "text": "A threat actor who wants to steal intellectual property is primarily targeting:", "options": ["Confidentiality", "Integrity only", "Availability only", "None of the above"], "correct": 0, "explanation": "Theft of information is a confidentiality attack."}, {"id": 30, "text": "A threat actor who wants to deface a website is primarily targeting:", "options": ["Availability only", "Integrity", "None of the above", "Confidentiality only"], "correct": 1, "explanation": "Unauthorised modification of content violates integrity."}, {"id": 31, "text": "A threat actor who wants to take an online service offline is primarily targeting:", "options": ["Integrity only", "Availability", "None of the above", "Confidentiality only"], "correct": 1, "explanation": "Denial of service is an availability attack."}, {"id": 32, "text": "Which of the following best describes the relationship between threats and vulnerabilities?", "options": ["A threat exploits a vulnerability to cause harm", "Vulnerabilities exploit threats", "Threats and vulnerabilities are identical", "They are unrelated"], "correct": 0, "explanation": "Risk is often expressed as a function of threats, vulnerabilities and impact."}, {"id": 33, "text": "In OS security, an example of a vulnerability is:", "options": ["A buffer overflow in a setuid program", "An up-to-date patch level", "A correctly configured firewall", "A strong password policy"], "correct": 0, "explanation": "Vulnerabilities are weaknesses that can be exploited."}, {"id": 34, "text": "In OS security, an example of a threat is:", "options": ["A correctly written access-control rule", "A hardware random-number generator", "A remote attacker scanning for known vulnerabilities", "A security patch"], "correct": 2, "explanation": "Threats are potential causes of unwanted incidents."}, {"id": 35, "text": "The Chinese Wall model is designed to prevent:", "options": ["All user logins", "All file writes", "Conflicts of interest by restricting access based on previous accesses", "All network traffic"], "correct": 2, "explanation": "It is used in consulting and financial environments where information barriers are required."}, {"id": 36, "text": "Why is the CIA triad still taught decades after it was introduced?", "options": ["Because it is the only model that exists", "Because it only applies to paper documents", "Because it remains a clear and practical way to organise thinking about security goals", "Because it replaces all technical controls"], "correct": 2, "explanation": "Its simplicity and generality make it a lasting foundation."}, {"id": 37, "text": "Which control primarily protects the integrity of the OS itself?", "options": ["A larger monitor", "Secure Boot and measured boot that detect unauthorised changes to the boot chain", "A faster network card", "More USB ports"], "correct": 1, "explanation": "Protecting the integrity of the boot process and kernel is essential."}, {"id": 38, "text": "Which control primarily protects the confidentiality of data stored on disk?", "options": ["A redundant power supply", "A larger page file", "A disk defragmenter", "Full-disk encryption such as LUKS or BitLocker"], "correct": 3, "explanation": "Encryption protects data even if the physical media is stolen."}, {"id": 39, "text": "Which control primarily protects the availability of a critical service?", "options": ["More detailed file permissions", "Longer AES keys", "Clustering, load balancing and automated failover", "Stronger password hashing"], "correct": 2, "explanation": "High-availability architectures keep services running despite failures or attacks."}, {"id": 40, "text": "A well-written security policy should address:", "options": ["Only the colour of the office walls", "How the organisation will achieve confidentiality, integrity and availability for its assets", "Only the number of coffee machines", "Only the brand of the firewall"], "correct": 1, "explanation": "Policies translate business needs into concrete security requirements."}, {"id": 41, "text": "When a system is said to have 'high integrity', it means:", "options": ["It has a colourful desktop theme", "Its data and software have not been, and are difficult to, modify without authorisation", "It has a large amount of RAM", "It has a very fast CPU"], "correct": 1, "explanation": "Integrity is about trustworthiness of data and code."}, {"id": 42, "text": "When a system is said to have 'high availability', it means:", "options": ["It logs every system call", "It has the strongest possible passwords", "It encrypts all data by default", "Authorised users can access its services with high probability when they need them"], "correct": 3, "explanation": "Availability is measured by uptime and recovery capability."}, {"id": 43, "text": "When a system is said to have 'high confidentiality', it means:", "options": ["It supports many programming languages", "It never crashes", "Sensitive information is accessible only to those who are authorised to see it", "It has the latest graphics drivers"], "correct": 2, "explanation": "Confidentiality is about controlling disclosure."}, {"id": 44, "text": "Which of the following is a good practice for protecting all three CIA properties?", "options": ["Regular risk assessment, least privilege, defence in depth and continuous monitoring", "Giving all users full privileges", "Disabling all logs and updates", "Ignoring security until after a breach"], "correct": 0, "explanation": "These practices form the foundation of a mature security programme."}, {"id": 45, "text": "The main reason to study formal security models is:", "options": ["They allow precise reasoning about whether a system satisfies its security policy", "They only apply to hardware", "They are only of historical interest", "They replace the need for testing"], "correct": 0, "explanation": "Formal models complement practical engineering with mathematical rigour."}, {"id": 46, "text": "An example of a threat to the integrity of an audit log is:", "options": ["A correctly functioning NTP service", "An attacker who has gained administrator rights deleting or altering the log entries", "A user reading a public web page", "A scheduled backup"], "correct": 1, "explanation": "Protecting the integrity of logs is essential for accountability and forensics."}, {"id": 47, "text": "Which of the following best summarises the CIA triad?", "options": ["They are three different names for the same goal", "They only apply to network traffic", "Confidentiality protects correctness, integrity protects secrecy, availability protects accessibility", "Confidentiality protects secrecy, integrity protects correctness, availability protects accessibility"], "correct": 3, "explanation": "This simple summary is useful for exam answers and for communicating with non-specialists."}, {"id": 48, "text": "Confidentiality primarily protects against: (exam focus 48)?", "options": ["Hardware failure", "Unauthorised modification of data", "Denial of service", "Unauthorised disclosure of information"], "correct": 3, "explanation": "Confidentiality ensures that only authorised parties can read sensitive data."}, {"id": 49, "text": "Confidentiality primarily protects against: (exam focus 49)?", "options": ["Hardware failure", "Unauthorised modification of data", "Denial of service", "Unauthorised disclosure of information"], "correct": 3, "explanation": "Confidentiality ensures that only authorised parties can read sensitive data."}, {"id": 50, "text": "Confidentiality primarily protects against: (exam focus 50)?", "options": ["Hardware failure", "Unauthorised modification of data", "Denial of service", "Unauthorised disclosure of information"], "correct": 3, "explanation": "Confidentiality ensures that only authorised parties can read sensitive data."}]}, {"moduleNumber": 3, "title": "Chapter 3: OS Security Architecture", "questions": [{"id": 1, "text": "Which of the following correctly defines kernel vs user mode?", "options": ["Two different file systems", "Two privilege levels that prevent user code from directly accessing privileged instructions or kernel memory", "Two network protocol stacks", "Two scheduling policies"], "correct": 1, "explanation": "Hardware-enforced modes isolate untrusted applications from the trusted computing base."}, {"id": 2, "text": "What is the main security purpose of the Reference Monitor Concept?", "options": ["A network packet sniffer", "A tool that only logs CPU usage", "A graphical interface component", "An abstract machine that mediates all accesses and must be always invoked, tamper-proof and verifiable"], "correct": 3, "explanation": "The Reference Monitor is a foundational idea in the design of trusted systems."}, {"id": 3, "text": "In OS security, the Trusted Computing Base (TCB) is best described as:", "options": ["The set of all hardware, firmware and software components critical to system security", "Only the network cable", "Only user applications", "Only the web browser"], "correct": 0, "explanation": "Anything outside the TCB is considered untrusted."}, {"id": 4, "text": "Which statement about least privilege is accurate?", "options": ["Running all code in kernel mode", "Giving every subject only the minimum rights necessary for its authorised tasks", "Disabling all security checks", "Giving every user full administrator rights"], "correct": 1, "explanation": "Least privilege limits the damage caused by compromised or buggy components."}, {"id": 5, "text": "A key property of defence in depth is that it:", "options": ["Relying on a single firewall", "Disabling logging", "Using only passwords", "Layering multiple independent controls so that the failure of one does not compromise the whole system"], "correct": 3, "explanation": "Multiple layers increase the cost and complexity of a successful attack."}, {"id": 6, "text": "Why is separation of duties important for operating-system security?", "options": ["Removing all audit logs", "Running without authentication", "Requiring more than one person or process to complete a critical task", "Allowing one administrator to do everything"], "correct": 2, "explanation": "Separation of duties reduces the risk of fraud and abuse of privilege."}, {"id": 7, "text": "Which of the following is a correct characteristic of complete mediation?", "options": ["Never checking accesses", "Checking every access to every object against the security policy", "Checking only the first access", "Checking only write accesses"], "correct": 1, "explanation": "Complete mediation is a classic secure-design principle."}, {"id": 8, "text": "How does economy of mechanism contribute to a more secure system?", "options": ["Making mechanisms as complex as possible", "Keeping security mechanisms as simple and small as possible", "Implementing security only in hardware", "Keeping mechanisms secret"], "correct": 1, "explanation": "Simple mechanisms are easier to verify and less likely to contain flaws."}, {"id": 9, "text": "What problem does fail-safe defaults primarily help to solve?", "options": ["Denying access unless it is explicitly permitted", "Permitting access unless it is explicitly denied", "Starting every user as administrator", "Disabling security by default"], "correct": 0, "explanation": "Fail-safe defaults reduce the impact of misconfiguration."}, {"id": 10, "text": "Which option best explains the role of open design?", "options": ["Keeping the design completely secret", "Relying on security through obscurity", "Using only proprietary software", "Not relying on the secrecy of the security mechanism itself"], "correct": 3, "explanation": "Security should depend on keys and configuration, not on hiding the algorithm."}, {"id": 11, "text": "Which of the following correctly defines security policy?", "options": ["The set of rules that define which subjects may access which objects under what conditions", "The colour scheme of the desktop", "The choice of programming language", "The physical layout of a data centre"], "correct": 0, "explanation": "Policies express security goals; mechanisms enforce them."}, {"id": 12, "text": "What is the main security purpose of security model?", "options": ["A formal representation of a security policy that can be analysed mathematically", "A hardware device driver", "A user-interface theme", "A compiler optimisation level"], "correct": 0, "explanation": "Models such as Bell-LaPadula and Biba allow rigorous reasoning about security properties."}, {"id": 13, "text": "In OS security, security mechanism is best described as:", "options": ["The colour of the server chassis", "A marketing brochure", "A technical control that implements part of the security policy", "A training manual only"], "correct": 2, "explanation": "Mechanisms are the concrete implementations of policy."}, {"id": 14, "text": "Which statement about the principle of least common mechanism is accurate?", "options": ["Minimising the amount of mechanism common to more than one user", "Maximising shared mechanism", "Removing all isolation", "Sharing all memory between processes"], "correct": 0, "explanation": "Shared mechanisms can become channels for unintended information flow."}, {"id": 15, "text": "A key property of psychological acceptability is that it:", "options": ["Security mechanisms should not make the system difficult to use correctly", "Security should always be as inconvenient as possible", "Security should disable all usability", "Users should never notice security"], "correct": 0, "explanation": "If security is too hard to use, users will find ways around it."}, {"id": 16, "text": "Why is the reference validation mechanism important for operating-system security?", "options": ["A disk defragmenter", "A desktop theme engine", "The concrete implementation of the reference monitor idea", "A network load balancer"], "correct": 2, "explanation": "It is the code that actually performs the access checks."}, {"id": 17, "text": "Which of the following is a correct characteristic of privilege rings?", "options": ["Different brands of CPU", "Different colours of network cables", "Hardware-supported levels of privilege that restrict the operations code may perform", "Different sizes of hard disks"], "correct": 2, "explanation": "Rings provide the foundation for kernel/user separation."}, {"id": 18, "text": "How does system-call interface contribute to a more secure system?", "options": ["An unrestricted way for user code to modify the kernel", "The controlled boundary through which user code requests kernel services", "A method of increasing CPU frequency", "A way to disable interrupts permanently"], "correct": 1, "explanation": "A well-designed system-call interface is essential for security."}, {"id": 19, "text": "What problem does trusted path primarily help to solve?", "options": ["A mechanism that guarantees a user is communicating with the genuine system and not a spoof", "Any graphical window", "Any network connection", "Any USB device"], "correct": 0, "explanation": "Trusted paths help prevent credential-stealing attacks such as fake login screens."}, {"id": 20, "text": "Which option best explains the role of object reuse?", "options": ["The requirement that storage is cleared before being reallocated to a new subject", "Reusing the same password forever", "Reusing the same network port", "Reusing the same process ID"], "correct": 0, "explanation": "Object-reuse controls prevent residual data from being disclosed to the next user of a resource."}, {"id": 21, "text": "Which of the following correctly defines kernel vs user mode (aspect 1)?", "options": ["Two network protocol stacks", "Two different file systems", "Two privilege levels that prevent user code from directly accessing privileged instructions or kernel memory", "Two scheduling policies"], "correct": 2, "explanation": "Hardware-enforced modes isolate untrusted applications from the trusted computing base."}, {"id": 22, "text": "What is the main security purpose of the Reference Monitor Concept (aspect 1)?", "options": ["A graphical interface component", "An abstract machine that mediates all accesses and must be always invoked, tamper-proof and verifiable", "A tool that only logs CPU usage", "A network packet sniffer"], "correct": 1, "explanation": "The Reference Monitor is a foundational idea in the design of trusted systems."}, {"id": 23, "text": "In OS security, the Trusted Computing Base (TCB) is best described as: (aspect 1)?", "options": ["Only the network cable", "Only the web browser", "The set of all hardware, firmware and software components critical to system security", "Only user applications"], "correct": 2, "explanation": "Anything outside the TCB is considered untrusted."}, {"id": 24, "text": "Which statement about least privilege is accurate (aspect 1)?", "options": ["Running all code in kernel mode", "Disabling all security checks", "Giving every user full administrator rights", "Giving every subject only the minimum rights necessary for its authorised tasks"], "correct": 3, "explanation": "Least privilege limits the damage caused by compromised or buggy components."}, {"id": 25, "text": "A key property of defence in depth is that it: (aspect 1)?", "options": ["Layering multiple independent controls so that the failure of one does not compromise the whole system", "Relying on a single firewall", "Disabling logging", "Using only passwords"], "correct": 0, "explanation": "Multiple layers increase the cost and complexity of a successful attack."}, {"id": 26, "text": "Why is separation of duties important for operating-system security (aspect 1)?", "options": ["Removing all audit logs", "Running without authentication", "Requiring more than one person or process to complete a critical task", "Allowing one administrator to do everything"], "correct": 2, "explanation": "Separation of duties reduces the risk of fraud and abuse of privilege."}, {"id": 27, "text": "Which of the following is a correct characteristic of complete mediation (aspect 1)?", "options": ["Checking only the first access", "Never checking accesses", "Checking every access to every object against the security policy", "Checking only write accesses"], "correct": 2, "explanation": "Complete mediation is a classic secure-design principle."}, {"id": 28, "text": "How does economy of mechanism contribute to a more secure system (aspect 1)?", "options": ["Keeping mechanisms secret", "Implementing security only in hardware", "Keeping security mechanisms as simple and small as possible", "Making mechanisms as complex as possible"], "correct": 2, "explanation": "Simple mechanisms are easier to verify and less likely to contain flaws."}, {"id": 29, "text": "What problem does fail-safe defaults primarily help to solve (aspect 1)?", "options": ["Disabling security by default", "Denying access unless it is explicitly permitted", "Starting every user as administrator", "Permitting access unless it is explicitly denied"], "correct": 1, "explanation": "Fail-safe defaults reduce the impact of misconfiguration."}, {"id": 30, "text": "Which option best explains the role of open design (aspect 1)?", "options": ["Using only proprietary software", "Keeping the design completely secret", "Relying on security through obscurity", "Not relying on the secrecy of the security mechanism itself"], "correct": 3, "explanation": "Security should depend on keys and configuration, not on hiding the algorithm."}, {"id": 31, "text": "Which of the following correctly defines security policy (aspect 1)?", "options": ["The set of rules that define which subjects may access which objects under what conditions", "The physical layout of a data centre", "The colour scheme of the desktop", "The choice of programming language"], "correct": 0, "explanation": "Policies express security goals; mechanisms enforce them."}, {"id": 32, "text": "What is the main security purpose of security model (aspect 1)?", "options": ["A hardware device driver", "A compiler optimisation level", "A user-interface theme", "A formal representation of a security policy that can be analysed mathematically"], "correct": 3, "explanation": "Models such as Bell-LaPadula and Biba allow rigorous reasoning about security properties."}, {"id": 33, "text": "In OS security, security mechanism is best described as: (aspect 1)?", "options": ["A marketing brochure", "The colour of the server chassis", "A training manual only", "A technical control that implements part of the security policy"], "correct": 3, "explanation": "Mechanisms are the concrete implementations of policy."}, {"id": 34, "text": "Which statement about the principle of least common mechanism is accurate (aspect 1)?", "options": ["Minimising the amount of mechanism common to more than one user", "Maximising shared mechanism", "Sharing all memory between processes", "Removing all isolation"], "correct": 0, "explanation": "Shared mechanisms can become channels for unintended information flow."}, {"id": 35, "text": "A key property of psychological acceptability is that it: (aspect 1)?", "options": ["Security should always be as inconvenient as possible", "Security mechanisms should not make the system difficult to use correctly", "Users should never notice security", "Security should disable all usability"], "correct": 1, "explanation": "If security is too hard to use, users will find ways around it."}, {"id": 36, "text": "Why is the reference validation mechanism important for operating-system security (aspect 1)?", "options": ["The concrete implementation of the reference monitor idea", "A desktop theme engine", "A network load balancer", "A disk defragmenter"], "correct": 0, "explanation": "It is the code that actually performs the access checks."}, {"id": 37, "text": "Which of the following is a correct characteristic of privilege rings (aspect 1)?", "options": ["Different colours of network cables", "Different sizes of hard disks", "Different brands of CPU", "Hardware-supported levels of privilege that restrict the operations code may perform"], "correct": 3, "explanation": "Rings provide the foundation for kernel/user separation."}, {"id": 38, "text": "How does system-call interface contribute to a more secure system (aspect 1)?", "options": ["A way to disable interrupts permanently", "An unrestricted way for user code to modify the kernel", "A method of increasing CPU frequency", "The controlled boundary through which user code requests kernel services"], "correct": 3, "explanation": "A well-designed system-call interface is essential for security."}, {"id": 39, "text": "What problem does trusted path primarily help to solve (aspect 1)?", "options": ["Any graphical window", "Any USB device", "A mechanism that guarantees a user is communicating with the genuine system and not a spoof", "Any network connection"], "correct": 2, "explanation": "Trusted paths help prevent credential-stealing attacks such as fake login screens."}, {"id": 40, "text": "Which option best explains the role of object reuse (aspect 1)?", "options": ["Reusing the same process ID", "Reusing the same password forever", "The requirement that storage is cleared before being reallocated to a new subject", "Reusing the same network port"], "correct": 2, "explanation": "Object-reuse controls prevent residual data from being disclosed to the next user of a resource."}, {"id": 41, "text": "Which of the following correctly defines kernel vs user mode (aspect 2)?", "options": ["Two scheduling policies", "Two different file systems", "Two network protocol stacks", "Two privilege levels that prevent user code from directly accessing privileged instructions or kernel memory"], "correct": 3, "explanation": "Hardware-enforced modes isolate untrusted applications from the trusted computing base."}, {"id": 42, "text": "What is the main security purpose of the Reference Monitor Concept (aspect 2)?", "options": ["A network packet sniffer", "A graphical interface component", "A tool that only logs CPU usage", "An abstract machine that mediates all accesses and must be always invoked, tamper-proof and verifiable"], "correct": 3, "explanation": "The Reference Monitor is a foundational idea in the design of trusted systems."}, {"id": 43, "text": "In OS security, the Trusted Computing Base (TCB) is best described as: (aspect 2)?", "options": ["The set of all hardware, firmware and software components critical to system security", "Only the web browser", "Only user applications", "Only the network cable"], "correct": 0, "explanation": "Anything outside the TCB is considered untrusted."}, {"id": 44, "text": "Which statement about least privilege is accurate (aspect 2)?", "options": ["Giving every subject only the minimum rights necessary for its authorised tasks", "Running all code in kernel mode", "Disabling all security checks", "Giving every user full administrator rights"], "correct": 0, "explanation": "Least privilege limits the damage caused by compromised or buggy components."}, {"id": 45, "text": "A key property of defence in depth is that it: (aspect 2)?", "options": ["Relying on a single firewall", "Disabling logging", "Layering multiple independent controls so that the failure of one does not compromise the whole system", "Using only passwords"], "correct": 2, "explanation": "Multiple layers increase the cost and complexity of a successful attack."}, {"id": 46, "text": "Why is separation of duties important for operating-system security (aspect 2)?", "options": ["Running without authentication", "Allowing one administrator to do everything", "Requiring more than one person or process to complete a critical task", "Removing all audit logs"], "correct": 2, "explanation": "Separation of duties reduces the risk of fraud and abuse of privilege."}, {"id": 47, "text": "Which of the following is a correct characteristic of complete mediation (aspect 2)?", "options": ["Checking only the first access", "Checking every access to every object against the security policy", "Never checking accesses", "Checking only write accesses"], "correct": 1, "explanation": "Complete mediation is a classic secure-design principle."}, {"id": 48, "text": "How does economy of mechanism contribute to a more secure system (aspect 2)?", "options": ["Keeping mechanisms secret", "Making mechanisms as complex as possible", "Implementing security only in hardware", "Keeping security mechanisms as simple and small as possible"], "correct": 3, "explanation": "Simple mechanisms are easier to verify and less likely to contain flaws."}, {"id": 49, "text": "What problem does fail-safe defaults primarily help to solve (aspect 2)?", "options": ["Permitting access unless it is explicitly denied", "Denying access unless it is explicitly permitted", "Disabling security by default", "Starting every user as administrator"], "correct": 1, "explanation": "Fail-safe defaults reduce the impact of misconfiguration."}, {"id": 50, "text": "Which option best explains the role of open design (aspect 2)?", "options": ["Not relying on the secrecy of the security mechanism itself", "Relying on security through obscurity", "Using only proprietary software", "Keeping the design completely secret"], "correct": 0, "explanation": "Security should depend on keys and configuration, not on hiding the algorithm."}]}, {"moduleNumber": 4, "title": "Chapter 4: Access Control Models", "questions": [{"id": 1, "text": "Which of the following correctly defines Discretionary Access Control (DAC)?", "options": ["An access-control model in which the owner of an object decides who may access it", "A model enforced solely by a central system poli let currentModuleIndex = 0;
let userScores = new Array(13).fill(0);
let answeredState = Array.from({ length: 13 }, () => new Array(50).fill(false));
let selectedAnswers = Array.from({ length: 13 }, () => new Array(50).fill(null));

function initModuleNav() {
    const nav = document.getElementById('moduleNav');
    nav.innerHTML = '';
    modulesData.forEach((mod, idx) => {
        const btn = document.createElement('button');
        btn.className = `module-btn ${idx === currentModuleIndex ? 'active' : ''}`;
        btn.innerText = `M${idx + 1}`;
        btn.title = mod.title;
        btn.onclick = () => selectModule(idx);
        nav.appendChild(btn);
    });
}

function selectModule(idx) {
    currentModuleIndex = idx;
    initModuleNav();
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuiz() {
    const mod = modulesData[currentModuleIndex];
    document.getElementById('moduleTitle').innerText = mod.title;
    const currentScore = userScores[currentModuleIndex];
    document.getElementById('scoreDisplay').innerText = `Module Score: ${currentScore} / 50`;
    const answeredCount = answeredState[currentModuleIndex].filter(Boolean).length;
    document.getElementById('progressBar').style.width = `${(answeredCount / 50) * 100}%`;

    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    mod.questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            let btnClass = 'option-btn';
            const isDisabled = answeredState[currentModuleIndex][qIdx];
            if (isDisabled) {
                if (optIdx === q.correct) btnClass += ' correct';
                else if (selectedAnswers[currentModuleIndex][qIdx] === optIdx) btnClass += ' wrong';
            }
            optionsHTML += `<li><button class="${btnClass}" ${isDisabled ? 'disabled' : ''} onclick="handleAnswer(${qIdx}, ${optIdx})">${String.fromCharCode(65 + optIdx)}. ${opt}</button></li>`;
        });

        const showExpl = answeredState[currentModuleIndex][qIdx];
        card.innerHTML = `
            <div class="question-meta">Question ${q.id} of 50 · Module ${currentModuleIndex + 1}</div>
            <div class="question-title">${q.text}</div>
            <ul class="options-list">${optionsHTML}</ul>
            <div class="explanation ${showExpl ? 'show' : ''}" id="expl-${qIdx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    document.getElementById('prevModuleBtn').disabled = currentModuleIndex === 0;
    document.getElementById('nextModuleBtn').disabled = currentModuleIndex === modulesData.length - 1;
}

function handleAnswer(qIdx, optIdx) {
    if (answeredState[currentModuleIndex][qIdx]) return;
    answeredState[currentModuleIndex][qIdx] = true;
    selectedAnswers[currentModuleIndex][qIdx] = optIdx;
    const mod = modulesData[currentModuleIndex];
    if (optIdx === mod.questions[qIdx].correct) {
        userScores[currentModuleIndex]++;
    }
    renderQuiz();
}

function changeModule(direction) {
    const newIdx = currentModuleIndex + direction;
    if (newIdx >= 0 && newIdx < modulesData.length) {
        selectModule(newIdx);
    }
}

initModuleNav();
renderQuiz();
</script>
