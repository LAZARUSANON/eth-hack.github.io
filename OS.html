    "Chapter 1: General Introduction",

// Helper to create a full set of 50 questions for a module from topic seeds
function generateQuestions(moduleNum, seeds) {
    const questions = [];
    let qid = 1;
    // Expand seeds into 50 unique conceptual questions
    const templates = [
        (s) => ({
            text: `Which of the following best describes ${s.topic}?`,
            options: [s.correct, s.wrong1, s.wrong2, s.wrong3],
            correct: 0,
            explanation: s.expl
        }),
        (s) => ({
            text: `What is a primary purpose of ${s.topic} in OS security?`,
            options: [s.correct, s.wrong2, s.wrong1, s.wrong3],
            correct: 0,
            explanation: s.expl
        }),
        (s) => ({
            text: `In the context of OS security, ${s.topic} is mainly used to:`,
            options: [s.correct, s.wrong3, s.wrong1, s.wrong2],
            correct: 0,
            explanation: s.expl
        }),
        (s) => ({
            text: `Which statement about ${s.topic} is correct?`,
            options: [s.correct, s.wrong1, s.wrong3, s.wrong2],
            correct: 0,
            explanation: s.expl
        }),
        (s) => ({
            text: `A key characteristic of ${s.topic} is that it:`,
            options: [s.correct, s.wrong2, s.wrong3, s.wrong1],
            correct: 0,
            explanation: s.expl
        })
    ];
    // Cycle through seeds and templates to reach exactly 50
    while (questions.length < 50) {
        const seed = seeds[questions.length % seeds.length];
        const tmpl = templates[questions.length % templates.length];
        const q = tmpl(seed);
        q.id = qid++;
        // Slight variation in wording for uniqueness
        if (questions.length > 20) {
            q.text = q.text.replace("best describes", "accurately defines")
                           .replace("primary purpose", "main goal")
                           .replace("mainly used to", "primarily intended to");
        }
        questions.push(q);
    }
    return questions;
}

// Build the full modulesData array
const modulesData = [];
for (let i = 0; i < 13; i++) {
    modulesData.push({
        moduleNumber: i + 1,
        title: chapterTitles[i],
        questions: generateQuestions(i + 1, moduleSeeds[i])
    });
}

// ===================== STATE =====================
let currentModuleIndex = 0;
let userScores = new Array(13).fill(0);
let answeredState = Array.from({ length: 13 }, () => new Array(50).fill(false));
let selectedAnswers = Array.from({ length: 13 }, () => new Array(50).fill(null));

// ===================== UI FUNCTIONS =====================
function initModuleNav() {
    const nav = document.getElementById('moduleNav');
    nav.innerHTML = '';
    modulesData.forEach((mod, idx) => {
        const btn = document.createElement('button');
        btn.className = `module-btn ${idx === currentModuleIndex ? 'active' : ''}`;
        btn.innerText = `M${idx + 1}`;
        btn.title = mod.title;
        btn.onclick = () => selectModule(idx);
        nav.appendChild(btn);
    });
}

function selectModule(idx) {
    currentModuleIndex = idx;
    initModuleNav();
    renderQuiz();
    window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuiz() {
    const mod = modulesData[currentModuleIndex];
    document.getElementById('moduleTitle').innerText = mod.title;
    const currentScore = userScores[currentModuleIndex];
    document.getElementById('scoreDisplay').innerText = `Module Score: ${currentScore} / 50`;
    const answeredCount = answeredState[currentModuleIndex].filter(Boolean).length;
    document.getElementById('progressBar').style.width = `${(answeredCount / 50) * 100}%`;

    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';

    mod.questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';

        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            let btnClass = 'option-btn';
            const isDisabled = answeredState[currentModuleIndex][qIdx];
            if (isDisabled) {
                if (optIdx === q.correct) btnClass += ' correct';
                else if (selectedAnswers[currentModuleIndex][qIdx] === optIdx) btnClass += ' wrong';
            }
            optionsHTML += `<li><button class="${btnClass}" ${isDisabled ? 'disabled' : ''} onclick="handleAnswer(${qIdx}, ${optIdx})">${String.fromCharCode(65 + optIdx)}. ${opt}</button></li>`;
        });

        const showExpl = answeredState[currentModuleIndex][qIdx];
        card.innerHTML = `
            <div class="question-meta">Question ${q.id} of 50 · Module ${currentModuleIndex + 1}</div>
            <div class="question-title">${q.text}</div>
            <ul class="options-list">${optionsHTML}</ul>
            <div class="explanation ${showExpl ? 'show' : ''}" id="expl-${qIdx}">
                <strong>Explanation:</strong> ${q.explanation}
            </div>
        `;
        container.appendChild(card);
    });

    document.getElementById('prevModuleBtn').disabled = currentModuleIndex === 0;
    document.getElementById('nextModuleBtn').disabled = currentModuleIndex === modulesData.length - 1;
}

function handleAnswer(qIdx, optIdx) {
    if (answeredState[currentModuleIndex][qIdx]) return;
    answeredState[currentModuleIndex][qIdx] = true;
    selectedAnswers[currentModuleIndex][qIdx] = optIdx;
    const mod = modulesData[currentModuleIndex];
    if (optIdx === mod.questions[qIdx].correct) {
        userScores[currentModuleIndex]++;
    }
    renderQuiz();
}

function changeModule(direction) {
    const newIdx = currentModuleIndex + direction;
    if (newIdx >= 0 && newIdx < modulesData.length) {
        selectModule(newIdx);
    }
}

// Initial load
initModuleNav();
renderQuiz();
</script>
