<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Python Quiz - Module 1: Basics | W3Schools Style</title>
<style>
  :root {
    --bg: #0d1117;
    --card: #161b22;
    --border: #30363d;
    --text: #e6edf3;
    --muted: #8b949e;
    --accent: #58a6ff;
    --success: #3fb950;
    --error: #f85149;
    --warning: #d29922;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    min-height: 100vh;
  }
  .header {
    background: var(--card);
    border-bottom: 1px solid var(--border);
    padding: 1rem 1.5rem;
    position: sticky;
    top: 0;
    z-index: 100;
  }
  .header-inner {
    max-width: 900px;
    margin: 0 auto;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 0.75rem;
  }
  .logo { font-size: 1.25rem; font-weight: 700; color: var(--accent); }
  .module-title { color: var(--muted); font-size: 0.95rem; }
  .progress-wrap {
    max-width: 900px;
    margin: 1rem auto 0;
    padding: 0 1.5rem;
  }
  .progress-bar {
    height: 8px;
    background: var(--border);
    border-radius: 4px;
    overflow: hidden;
  }
  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--accent), #79c0ff);
    width: 0%;
    transition: width 0.3s ease;
  }
  .stats {
    display: flex;
    gap: 1.5rem;
    margin-top: 0.5rem;
    font-size: 0.875rem;
    color: var(--muted);
  }
  .container {
    max-width: 900px;
    margin: 0 auto;
    padding: 1.5rem;
  }
  .question-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.5rem;
    margin-bottom: 1.25rem;
    transition: border-color 0.2s;
  }
  .question-card.answered { border-color: var(--accent); }
  .q-number {
    font-size: 0.75rem;
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
    letter-spacing: 0.05em;
    margin-bottom: 0.5rem;
  }
  .q-text {
    font-size: 1.1rem;
    font-weight: 500;
    margin-bottom: 1.25rem;
  }
  .options { display: flex; flex-direction: column; gap: 0.6rem; }
  .option {
    display: flex;
    align-items: flex-start;
    gap: 0.75rem;
    padding: 0.85rem 1rem;
    background: #0d1117;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.15s;
  }
  .option:hover:not(.disabled) {
    border-color: var(--accent);
    background: #1c2128;
  }
  .option.selected { border-color: var(--accent); }
  .option.correct {
    border-color: var(--success);
    background: rgba(63, 185, 80, 0.12);
  }
  .option.wrong {
    border-color: var(--error);
    background: rgba(248, 81, 73, 0.12);
  }
  .option.disabled { cursor: default; opacity: 0.85; }
  .option input { display: none; }
  .radio {
    width: 18px;
    height: 18px;
    border: 2px solid var(--muted);
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 2px;
    position: relative;
  }
  .option.selected .radio { border-color: var(--accent); }
  .option.correct .radio { border-color: var(--success); background: var(--success); }
  .option.wrong .radio { border-color: var(--error); background: var(--error); }
  .option.correct .radio::after,
  .option.wrong .radio::after {
    content: "";
    position: absolute;
    top: 3px; left: 3px;
    width: 8px; height: 8px;
    background: #fff;
    border-radius: 50%;
  }
  .explanation {
    display: none;
    margin-top: 1rem;
    padding: 1rem;
    background: #0d1117;
    border-left: 3px solid var(--accent);
    border-radius: 0 8px 8px 0;
    font-size: 0.95rem;
    color: var(--muted);
  }
  .explanation.show { display: block; }
  .explanation strong { color: var(--success); }
  .nav-footer {
    max-width: 900px;
    margin: 2rem auto;
    padding: 0 1.5rem 3rem;
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 1rem;
  }
  .btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
    padding: 0.75rem 1.5rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 0.95rem;
    text-decoration: none;
    border: none;
    cursor: pointer;
    transition: all 0.15s;
  }
  .btn-primary {
    background: var(--accent);
    color: #0d1117;
  }
  .btn-primary:hover { background: #79c0ff; }
  .btn-secondary {
    background: transparent;
    color: var(--text);
    border: 1px solid var(--border);
  }
  .btn-secondary:hover { border-color: var(--accent); color: var(--accent); }
  .score-box {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.75rem 1.25rem;
    font-size: 0.95rem;
  }
  .score-box span { color: var(--accent); font-weight: 700; }
  @media (max-width: 600px) {
    .q-text { font-size: 1rem; }
    .option { padding: 0.7rem 0.85rem; }
  }
</style>
</head>
<body>
  <header class="header">
    <div class="header-inner">
      <div>
        <div class="logo">🐍 Python Quiz</div>
        <div class="module-title">Module 1 of 4 · Basics (Home, Intro, Get Started, Syntax, Comments)</div>
      </div>
      <div class="score-box">Score: <span id="score">0</span> / <span id="total">50</span></div>
    </div>
  </header>

  <div class="progress-wrap">
    <div class="progress-bar"><div class="progress-fill" id="progress"></div></div>
    <div class="stats">
      <span>Answered: <span id="answered">0</span>/50</span>
      <span>Correct: <span id="correct-count">0</span></span>
    </div>
  </div>

  <div class="container" id="quiz-container"></div>

  <div class="nav-footer">
    <a href="#" class="btn btn-secondary" style="visibility:hidden">← Previous</a>
    <a href="python_module2.html" class="btn btn-primary">Next Module: Variables & Data →</a>
  </div>

    correct: 1,
    exp: "W3Schools provides an Online Python Editor that runs directly in the browser and shows both the code and the result."
  },
  {
    q: "Is Python case-sensitive?",
    options: ["No", "Yes", "Only for variables", "Only for functions"],
    correct: 1,
    exp: "Python is case-sensitive. Variable names 'a' and 'A' are different."
  },

let score = 0;
let answered = 0;
const container = document.getElementById('quiz-container');

function renderQuestions() {
  questions.forEach((item, idx) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${idx}`;
    card.innerHTML = `
      <div class="q-number">Question ${idx + 1} of 50</div>
      <div class="q-text">${item.q}</div>
      <div class="options">
        ${item.options.map((opt, oIdx) => `
          <label class="option" data-q="${idx}" data-opt="${oIdx}">
            <input type="radio" name="q${idx}" value="${oIdx}">
            <span class="radio"></span>
            <span>${opt}</span>
          </label>
        `).join('')}
      </div>
      <div class="explanation" id="exp${idx}"></div>
    `;
    container.appendChild(card);
  });

  document.querySelectorAll('.option').forEach(opt => {
    opt.addEventListener('click', function() {
      const qIdx = parseInt(this.dataset.q);
      const oIdx = parseInt(this.dataset.opt);
      const card = document.getElementById(`q${qIdx}`);
      if (card.classList.contains('answered')) return;

      card.classList.add('answered');
      answered++;
      document.getElementById('answered').textContent = answered;
      document.getElementById('progress').style.width = (answered / 50 * 100) + '%';

      const correctIdx = questions[qIdx].correct;
      const options = card.querySelectorAll('.option');
      options.forEach(o => o.classList.add('disabled'));

      if (oIdx === correctIdx) {
        this.classList.add('correct', 'selected');
        score++;
        document.getElementById('score').textContent = score;
        document.getElementById('correct-count').textContent = score;
      } else {
        this.classList.add('wrong', 'selected');
        options[correctIdx].classList.add('correct');
      }

      const exp = document.getElementById(`exp${qIdx}`);
      exp.innerHTML = `<strong>Correct answer:</strong> ${questions[qIdx].options[correctIdx]}<br><br>${questions[qIdx].exp}`;
      exp.classList.add('show');
    });
  });
}

renderQuestions();
</script>
</body>
</html>
