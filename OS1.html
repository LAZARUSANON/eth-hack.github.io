 different object than the one that was authorised", "The problem only exists on network file systems"], "correct": 2, "explanation": "Time-of-check-to-time-of-use (TOCTOU) races are a classic issue."}, {"id": 44, "text": "When comparing why simply deleting a file is usually insufficient for secure deletion with related mechanisms, which distinction is the most security-relevant (consideration 4)?", "options": ["Most file systems only unlink the directory entry; the data blocks remain on media until overwritten and can be recovered by forensic tools", "Forensic recovery of deleted files is impossible", "Secure deletion is automatic on all modern file systems", "Deletion always overwrites the data with zeros"], "correct": 0, "explanation": "True secure deletion requires explicit overwriting or encryption with key disposal."}, {"id": 45, "text": "A system designer claims that the role of file-system integrity checking tools (AIDE, Tripwire, IMA) alone is sufficient to guarantee security. The strongest counter-argument is: (consideration 4)?", "options": ["They prevent all modifications", "They replace the need for access control", "They detect unauthorised modification of critical files by comparing current cryptographic hashes against a known-good baseline", "They only work on encrypted file systems"], "correct": 2, "explanation": "Integrity checkers are a classic detection control for both malware and insider tampering."}, {"id": 46, "text": "Which of the following is a realistic attack or failure mode that EFS (Encrypting File System) on Windows is intended to mitigate (consideration 4)?", "options": ["EFS keys are stored in clear text in the registry", "EFS is a full-disk encryption solution identical to BitLocker", "EFS cannot be used by ordinary users", "It provides transparent per-file or per-directory encryption whose keys are protected by the user's certificate and the Windows DPAPI infrastructure"], "correct": 3, "explanation": "EFS and BitLocker address different layers of the storage stack."}, {"id": 47, "text": "In a high-assurance evaluation, which property of the danger of world-writable sticky directories that are not sticky would receive the most scrutiny (consideration 4)?", "options": ["World-writable directories are always safe", "Any user can delete or rename another user's files inside the directory, leading to denial of service or more sophisticated attacks", "The sticky bit has no security function", "Only the owner of a directory can ever delete files inside it"], "correct": 1, "explanation": "The sticky bit on directories such as /tmp is a classic, still-relevant protection."}, {"id": 48, "text": "Which of the following best explains why why encryption of data at rest does not eliminate the need for access control must be combined with other controls rather than used in isolation (consideration 4)?", "options": ["Encryption makes access control unnecessary", "Once a legitimate user or process has decrypted the data, access-control mechanisms are still required to prevent that subject from exfiltrating or misusing it", "Access control is only needed for network traffic", "Encrypted data can never be read by authorised users"], "correct": 1, "explanation": "Encryption and access control are complementary."}, {"id": 49, "text": "An attacker who has already obtained limited access is most likely to attempt to subvert the security implications of hard links across security boundaries by: (consideration 4)?", "options": ["Hard links automatically encrypt the target", "Hard links can only be created by root", "A hard link can give a low-privilege user a persistent name for a high-privilege file, potentially bypassing path-based access checks", "Hard links have no security implications"], "correct": 2, "explanation": "Many systems restrict the creation of hard links to directories writable by the caller."}, {"id": 50, "text": "Which of the following is a common misconception about auditing versus logging in the context of file-system security that can lead to insecure deployments (consideration 4)?", "options": ["Logging records events; auditing is the systematic, policy-driven examination of those records to detect violations or support investigations", "Logging is sufficient without any review", "Auditing is performed only by the kernel", "The two terms are interchangeable"], "correct": 0, "explanation": "Without review, logs provide little security value."}]}, {"moduleNumber": 7, "title": "Chapter 7: Malware and OS Threats", "questions": [{"id": 1, "text": "Which of the following statements about the distinction between a virus and a worm is most accurate in a modern OS security context?", "options": ["Worms cannot spread across networks", "A virus requires a host file and user action to propagate; a worm is self-contained and propagates automatically across networks", "The terms are interchangeable", "Viruses never require user action"], "correct": 1, "explanation": "The classic distinction remains useful for understanding propagation models."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with why rootkits are particularly dangerous. The best answer is:", "options": ["They are easy to detect with ordinary antivirus", "They only affect user-mode processes", "They actively conceal their presence and the presence of other malicious components by subverting the OS's own reporting mechanisms", "They cannot survive a reboot"], "correct": 2, "explanation": "Kernel-mode rootkits can render most traditional detection tools unreliable."}, {"id": 3, "text": "Which scenario most clearly demonstrates a failure or misuse of living-off-the-land (LOLBin) techniques?", "options": ["LOLBins are a form of hardware attack", "LOLBins are easily blocked by blacklisting all system utilities", "Attackers abuse legitimate, signed OS binaries (PowerShell, WMI, certutil, etc.) so that no new malicious executable needs to be introduced", "LOLBins can only be used by administrators"], "correct": 2, "explanation": "Because the binaries are needed for normal administration, simple blacklisting is rarely feasible."}, {"id": 4, "text": "When comparing the role of persistence mechanisms with related mechanisms, which distinction is the most security-relevant?", "options": ["Modern malware never attempts persistence", "They ensure that malware is re-executed after a reboot or user logoff, turning a transient compromise into a durable one", "Persistence mechanisms are always visible in ordinary process listings", "Persistence is only relevant to network worms"], "correct": 1, "explanation": "Understanding common persistence locations is essential for both detection and eradication."}, {"id": 5, "text": "A system designer claims that why signature-based detection alone is insufficient against modern malware alone is sufficient to guarantee security. The strongest counter-argument is:", "options": ["Malware authors cannot change their code", "Signatures detect every possible malware sample", "Polymorphism, packing, encryption and rapid release of new variants allow malware to evade static signatures", "Behavioural analysis is never useful"], "correct": 2, "explanation": "Modern defences combine signatures with behavioural, heuristic and machine-learning approaches."}, {"id": 6, "text": "Which of the following is a realistic attack or failure mode that ransomware as an availability (and integrity) attack is intended to mitigate?", "options": ["Ransomware only steals data", "Ransomware is a pure confidentiality attack", "Ransomware never affects integrity", "By encrypting the victim's data and withholding the key, ransomware denies the owner legitimate access and simultaneously destroys the integrity of the original plaintext"], "correct": 3, "explanation": "The business impact is primarily loss of availability of critical data."}, {"id": 7, "text": "In a high-assurance evaluation, which property of the difficulty of detecting fileless malware would receive the most scrutiny?", "options": ["Fileless malware cannot achieve persistence", "Fileless malware is easy to detect with any antivirus", "Because it resides primarily in memory or in legitimate system stores (registry, WMI, etc.), traditional file-scanning approaches see little or nothing", "Fileless malware only runs on outdated systems"], "correct": 2, "explanation": "Memory forensics and behavioural monitoring become correspondingly more important."}, {"id": 8, "text": "Which of the following best explains why command-and-control (C2) traffic as a detection opportunity must be combined with other controls rather than used in isolation?", "options": ["Even sophisticated malware must eventually communicate with its operator; that traffic can be detected by network monitoring, beaconing analysis or TLS fingerprinting", "C2 traffic is always indistinguishable from ordinary traffic", "Blocking all outbound traffic is the only defence", "C2 is only used by ransomware"], "correct": 0, "explanation": "Many modern detection programmes treat anomalous outbound connections as high-value signals."}, {"id": 9, "text": "An attacker who has already obtained limited access is most likely to attempt to subvert why application allow-listing (whitelisting) is a strong preventive control against malware by:", "options": ["Allow-listing is identical to antivirus signatures", "Allow-listing only works for network traffic", "Only pre-approved binaries and scripts are permitted to execute, so novel or modified malware is blocked by default", "Allow-listing is impossible to manage in practice"], "correct": 2, "explanation": "When combined with least privilege, allow-listing dramatically raises the bar for an attacker."}, {"id": 10, "text": "Which of the following is a common misconception about the concept of a 'supply-chain' malware attack that can lead to insecure deployments?", "options": ["Supply-chain attacks only affect open-source software", "T ses the bar for an attacker."}, {"id": 50, "text": "Which of the following is a common misconception about the concept of a 'supply-chain' malware attack that can lead to insecure deployments (consideration 4)?", "options": ["Supply-chain attacks only affect open-source software", "They require the attacker to break into every target individually", "They are easily prevented by ordinary antivirus", "Malicious code is introduced into a legitimate software product or update channel before the software reaches the victim, so the victim installs the malware through normal means"], "correct": 3, "explanation": "Supply-chain attacks are attractive because a single compromise can reach many victims."}]}, {"moduleNumber": 8, "title": "Chapter 8: Privilege Escalation and Exploits", "questions": [{"id": 1, "text": "Which of the following statements about vertical versus horizontal privilege escalation is most accurate in a modern OS security context?", "options": ["Vertical escalation obtains higher privileges (user to admin/root); horizontal escalation obtains the privileges of a different principal at the same level", "Horizontal escalation is always more severe", "Vertical escalation is impossible on modern systems", "The two terms describe identical actions"], "correct": 0, "explanation": "Both forms are valuable to an attacker; vertical is usually the higher-value goal."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with why a vulnerable setuid-root binary is a classic privilege-escalation vector. The best answer is:", "options": ["Setuid only affects the real UID, not the effective UID", "Setuid binaries cannot be exploited", "Any local user who can exploit the binary obtains an effective UID of 0, i.e., full administrative power", "Setuid is required for all network services"], "correct": 2, "explanation": "Minimising and hardening the set of setuid binaries is a standard hardening step."}, {"id": 3, "text": "Which scenari e action and the time can support non-repudiation claims"], "correct": 3, "explanation": "The evidential value of logs depends on their integrity and the reliability of authentication."}]}, {"moduleNumber": 12, "title": "Chapter 12: Forensics Basics", "questions": [{"id": 1, "text": "Which of the following statements about the principle of preserving evidence integrity is most accurate in a modern OS security context?", "options": ["Hashes are unnecessary if the investigator is trusted", "Investigators must be able to demonstrate that the evidence has not been altered since it was collected; this is typically achieved by cryptographic hashing and proper chain-of-custody documentation", "Chain of custody is only a bureaucratic formality", "Evidence may be freely modified during analysis"], "correct": 1, "explanation": "Without integrity and provenance, evidence may be inadmissible or unpersuasive."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with why volatile data should be collected before powering off a system. The best answer is:", "options": ["Powering off preserves volatile data", "RAM contents, network connections, running processes and encryption keys exist only while the system is powered; they disappear on shutdown and cannot be recovered from disk", "RAM contents are automatically written to disk on shutdown", "Volatile data is always less important than disk images"], "correct": 1, "explanation": "The order of volatility is a fundamental concept in live response."}, {"id": 3, "text": "Which scenario most clearly demonstrates a failure or misuse of the purpose of a forensic disk image?", "options": ["It can only be created after the system has been rebooted", "It is simply a copy of the visible files", "It is a bit-for-bit copy that includes unallocated space, deleted files and slack space, allowing analysis without altering the original media", "It excludes deleted data by design"], "correct": 2, "explanation": "Working from an image protects the original evidence."}, {"id": 4, "text": "When comparing chain of custody with related mechanisms, which distinction is the most security-relevant?", "options": ["It is only required for paper documents", "It is irrelevant if the evidence is hashed", "It can be reconstructed after the fact from memory", "A documented, unbroken record of every person who handled the evidence and every action performed on it, establishing its provenance for legal or disciplinary proceedings"], "correct": 3, "explanation": "Gaps in the chain can render otherwise strong evidence unusable."}, {"id": 5, "text": "A system designer claims that the value of memory forensics alone is sufficient to guarantee security. The strongest counter-argument is:", "options": ["Only disk images are useful", "Memory forensics is obsolete", "A memory dump can reveal running malware (including fileless implants), network connections, encryption keys, injected code and other artefacts that never appear on disk", "Memory dumps cannot be analysed after the fact"], "correct": 2, "explanation": "Volatility, Rekall and similar frameworks exist precisely for this purpose."}, {"id": 6, "text": "Which of the following is a realistic attack or failure mode that timeline analysis is intended to mitigate?", "options": ["A single log source is always sufficient", "Timestamps are never reliable", "Timelines are only useful for performance analysis", "By correlating timestamps from multiple sources (file systems, logs, registry, browser artefacts, etc.) an investigator can reconstruct the sequence of attacker actions"], "correct": 3, "explanation": "Super-timelines are a standard technique in modern digital forensics."}, {"id": 7, "text": "In a high-assurance evaluation, which property of the risk of analysing evidence on the original media would receive the most scrutiny?", "options": ["Analysis on the original is always preferred", "Any action performed on the original can alter ti ns": [{"id": 1, "text": "Which of the following statements about Secure Boot is most accurate in a modern OS security context?", "options": ["Secure Boot encrypts the entire disk", "Firmware verifies a cryptographic signature on the bootloader (and typically subsequent stages) before allowing execution, thereby preventing unauthorised boot code from running", "Secure Boot eliminates the need for OS-level security", "Secure Boot is only a performance feature"], "correct": 1, "explanation": "Secure Boot establishes a chain of trust from the firmware onward."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with Measured Boot and the TPM. The best answer is:", "options": ["Measurements can be freely altered by the OS", "Each stage of the boot process measures (hashes) the next stage and extends the result into PCR registers in the TPM; the resulting measurements can be used for remote attestation or for sealing secrets", "Measured Boot is identical to Secure Boot", "The TPM is only used for disk encryption"], "correct": 1, "explanation": "Measured Boot provides a trustworthy record of what actually executed."}, {"id": 3, "text": "Which scenario most clearly demonstrates a failure or misuse of the security purpose of a TPM?", "options": ["It provides a hardware root of trust for cryptographic keys and measurements that is resistant to software-only attacks", "It is optional and provides no security benefit", "It replaces the need for an operating system", "It is only a high-performance random-number generator"], "correct": 0, "explanation": "Keys protected by a TPM are significantly harder to extract than keys held in ordinary software."}, {"id": 4, "text": "When comparing Control Flow Integrity (CFI) with related mechanisms, which distinction is the most security-relevant?", "options": ["CFI encrypts the binary", "By restricting the set of allowed targets for indirect branches and calls, CFI reduces the expressiveness of code-reuse attacks such as ROP and JOP", "CFI eliminates the need for ASLR and DEP", "CFI is a pure availability mechanism"], "correct": 1, "explanation": "CFI is a powerful complementary defence once an attacker has obtained some control of the instruction pointer."}, {"id": 5, "text": "A system designer claims that sandboxing as a defence-in-depth technique alone is sufficient to guarantee security. The strongest counter-argument is:", "options": ["Sandboxes replace the need for patching the application", "Sandboxes make applications immune to all vulnerabilities", "Even if an application is fully compromised, the sandbox restricts the resources and system calls it can access, limiting the damage and the ability to escalate", "Sandboxes are only useful for browsers"], "correct": 2, "explanation": "Modern browsers, document viewers and mobile operating systems rely heavily on sandboxing."}, {"id": 6, "text": "Which of the following is a realistic attack or failure mode that the concept of a Software Bill of Materials (SBOM) is intended to mitigate?", "options": ["SBOMs are relevant only to hardware", "An SBOM is a formal, machine-readable inventory of the components and dependencies that constitute a software product, enabling rapid identification of exposure to newly disclosed vulnerabilities", "An SBOM is only a marketing document", "SBOMs replace the need for vulnerability scanning"], "correct": 1, "explanation": "SBOMs are increasingly required by regulation and by sophisticated customers."}, {"id": 7, "text": "In a high-assurance evaluation, which property of confidential computing would receive the most scrutiny?", "options": ["Hardware-based trusted execution environments (SGX, SEV, TDX, CCA, etc.) protect data while it is being processed, closing the traditional gap between protection of data at rest and data in transit", "It is identical to full-disk encryption", "It eliminates the need for access control", "Confidential computing only protects data at rest"], let currentModuleIndex = 0;
let userScores = new Array(13).fill(0);
let answeredState = Array.from({length:13}, () => new Array(50).fill(false));
let selectedAnswers = Array.from({length:13}, () => new Array(50).fill(null));

function initModuleNav() {
    const nav = document.getElementById('moduleNav');
    nav.innerHTML = '';
    modulesData.forEach((mod, idx) => {
        const btn = document.createElement('button');
        btn.className = 'module-btn' + (idx === currentModuleIndex ? ' active' : '');
        btn.innerText = 'M' + (idx + 1);
        btn.title = mod.title;
        btn.onclick = () => selectModule(idx);
        nav.appendChild(btn);
    });
}
function selectModule(idx) {
    currentModuleIndex = idx;
    initModuleNav();
    renderQuiz();
    window.scrollTo({top:0, behavior:'smooth'});
}
function renderQuiz() {
    const mod = modulesData[currentModuleIndex];
    document.getElementById('moduleTitle').innerText = mod.title;
    document.getElementById('scoreDisplay').innerText = 'Module Score: ' + userScores[currentModuleIndex] + ' / 50';
    const answeredCount = answeredState[currentModuleIndex].filter(Boolean).length;
    document.getElementById('progressBar').style.width = (answeredCount / 50 * 100) + '%';
    const container = document.getElementById('questionsContainer');
    container.innerHTML = '';
    mod.questions.forEach((q, qIdx) => {
        const card = document.createElement('div');
        card.className = 'question-card';
        let optionsHTML = '';
        q.options.forEach((opt, optIdx) => {
            let btnClass = 'option-btn';
            const isDisabled = answeredState[currentModuleIndex][qIdx];
            if (isDisabled) {
                if (optIdx === q.correct) btnClass += ' correct';
                else if (selectedAnswers[currentModuleIndex][qIdx] === optIdx) btnClass += ' wrong';
            }
            optionsHTML += '<li><button class="' + btnClass + '" ' + (isDisabled ? 'disabled' : '') + ' onclick="handleAnswer(' + qIdx + ',' + optIdx + ')">' + String.fromCharCode(65 + optIdx) + '. ' + opt + '</button></li>';
        });
        const showExpl = answeredState[currentModuleIndex][qIdx];
        card.innerHTML = '<div class="question-meta">Question ' + q.id + ' of 50 · Module ' + (currentModuleIndex + 1) + '</div><div class="question-title">' + q.text + '</div><ul class="options-list">' + optionsHTML + '</ul><div class="explanation ' + (showExpl ? 'show' : '') + '"><strong>Explanation:</strong> ' + q.explanation + '</div>';
        container.appendChild(card);
    });
    document.getElementById('prevModuleBtn').disabled = currentModuleIndex === 0;
    document.getElementById('nextModuleBtn').disabled = currentModuleIndex === modulesData.length - 1;
}
function handleAnswer(qIdx, optIdx) {
    if (answeredState[currentModuleIndex][qIdx]) return;
    answeredState[currentModuleIndex][qIdx] = true;
    selectedAnswers[currentModuleIndex][qIdx] = optIdx;
    if (optIdx === modulesData[currentModuleIndex].questions[qIdx].correct) userScores[currentModuleIndex]++;
    renderQuiz();
}
function changeModule(direction) {
    const newIdx = currentModuleIndex + direction;
    if (newIdx >= 0 && newIdx < modulesData.length) selectModule(newIdx);
}
initModuleNav();
renderQuiz();
</script>
