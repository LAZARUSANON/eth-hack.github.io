const modulesData = [{"moduleNumber": 1, "title": "Chapter 1: General Introduction", "questions": [{"id": 1, "text": "A process running in user mode attempts to execute a privileged instruction. What is the most accurate description of the outcome on a correctly designed system?", "options": ["The process is silently terminated without any notification", "The instruction is emulated in user space by the C library", "The instruction executes successfully because the process has a valid PID", "The CPU raises an exception and transfers control to a kernel exception handler"], "correct": 3, "explanation": "Hardware privilege rings enforce that privileged instructions can only be executed in kernel mode; an attempt from user mode causes a trap."}, {"id": 2, "text": "Which of the following most accurately distinguishes the Trusted Computing Base (TCB) from the rest of the system?", "options": ["The TCB is the minimal set of components that must be trusted for the security policy to be enforced; everything outside it is untrusted", "The TCB includes only hardware and excludes all software", "The TCB is simply another name for the kernel", "The TCB consists of every installed application and library"], "correct": 0, "explanation": "By definition the TCB is the collection of protection mechanisms that are critical to security; minimising and verifying it is a core goal of secure design."}, {"id": 3, "text": "An administrator claims that 'opening only port 22 and running everything as root is secure because the attack surface is small'. Which security principle is most clearly violated?", "options": ["Least privilege", "Economy of mechanism", "Open design", "Psychological acceptability"], "correct": 0, "explanation": "Even if the network attack surface is reduced, granting every process root privileges violates least privilege and greatly increases the impact of any compromise."}, {"id": 4, "text": "Why is the system-call interface considered a critical security boundary?", "options": ["It encrypts all data written to disk", "It is responsible for scheduling processes on the CPU", "It is the only controlled path by which untrusted user-mode code can request privileged kernel services", "It is the interface used exclusively by device drivers"], "correct": 2, "explanation": "All privileged operations requested by applications must pass through the system-call interface; therefore its design and correctness directly affect system security."}, {"id": 5, "text": "Which statement best explains why a monolithic kernel generally has a larger Trusted Computing Base than a well-designed microkernel?", "options": ["Microkernels are always written in type-safe languages", "Monolithic kernels do not support device drivers", "Monolithic kernels never use hardware protection rings", "In a monolithic kernel most OS services run in privileged mode, so a bug in any of them can compromise the whole TCB"], "correct": 3, "explanation": "The size of the TCB grows with the amount of code that runs with high privilege; microkernels move many services into user-space processes."}, {"id": 6, "text": "A developer argues that security through obscurity is acceptable because the company's proprietary kernel modifications are secret. Which classic design principle does this violate?", "options": ["Complete mediation", "Fail-safe defaults", "Open design", "Least common mechanism"], "correct": 2, "explanation": "The open-design principle states that security should not depend on the secrecy of the design itself; it should depend on the secrecy of keys or other protected information."}, {"id": 7, "text": "What is the most important security consequence of giving each process its own virtual address space?", "options": ["Context switches become unnecessary", "Processes can never communicate with one another", "A compromised process cannot directly read or write the memory of other processes or the kernel", "The total amount of physical RAM is increased"], "correct": 2, "explanation": "Virtual-memory isolation is the primary hardware-enforced mechanism that limits the damage a single process can inflict."}, {"id": 8, "text": "Which of the following is the best illustration of the principle of complete mediation?", "options": ["Every file-open, every memory-map and every inter-process communication request is checked against the current security policy", "Access checks are performed only for network connections", "Only the first access to an object is checked; subsequent accesses are assumed safe", "Access checks are performed only for write operations"], "correct": 0, "explanation": "Complete mediation requires that every access to every object is validated; caching of decisions is permissible only when the policy cannot have changed."}, {"id": 9, "text": "An attacker who already possesses a valid low-privilege shell on a system is best classified as which type of threat actor in a typical threat model?", "options": ["A pure outsider with no foothold", "An insider or an external attacker who has achieved initial access and is now seeking privilege escalation", "A nation-state actor by definition", "A script kiddie who cannot escalate"], "correct": 1, "explanation": "Once an attacker has any code execution, the threat model must treat them as having a presence inside the system; subsequent actions are often lateral movement or privilege escalation."}, {"id": 10, "text": "Why does the principle of fail-safe defaults recommend that access be denied unless explicitly granted?", "options": ["It eliminates the need for authentication", "It makes the system slower and therefore harder to attack", "A missing or incorrect permission entry then results in a safe (deny) outcome rather than an unsafe (allow) outcome", "It forces every user to be an administrator"], "correct": 2, "explanation": "Fail-safe defaults ensure that configuration errors or incomplete policy tend to produce a secure rather than an insecure state."}, {"id": 11, "text": "Which of the following scenarios most clearly demonstrates a failure of process isolation?", "options": ["A process uses a large amount of CPU time", "A bug in a web browser allows JavaScript to read the memory of a password manager running in a different process", "Two processes communicate through a deliberately created shared-memory region", "A process is terminated by the OOM killer"], "correct": 1, "explanation": "True isolation means that even a fully compromised process cannot access another process's private memory without an explicit, mediated channel."}, {"id": 12, "text": "The reference-monitor concept requires three properties. Which property is violated if a high-privilege process can overwrite the kernel's access-control data structures?", "options": ["Open design", "Always invoked (complete mediation)", "Tamper-proofness (the reference monitor itself must be protected from modification)", "Small enough to be verifiable"], "correct": 2, "explanation": "If the reference-validation mechanism can be altered by untrusted code, it is no longer trustworthy."}, {"id": 13, "text": "Which of the following is the most accurate description of the attack surface of a running OS?", "options": ["The set of all entry points (system calls, network ports, device interfaces, file formats, etc.) that an attacker can use to interact with the system", "Only the physical ports on the machine", "Only the open TCP and UDP ports", "Only the set of installed packages"], "correct": 0, "explanation": "A comprehensive view of attack surface includes every interface that crosses a trust boundary."}, {"id": 14, "text": "A security evaluation claims that a system is secure because 'no known exploits exist for it today'. Which fundamental limitation does this reasoning ignore?", "options": ["Security is solely a function of the number of open ports", "Exploits are the only form of attack", "All systems are equally secure", "Absence of known exploits does not prove absence of vulnerabilities; zero-day and future attacks remain possible"], "correct": 3, "explanation": "Security is not a binary state that can be established by the non-existence of public exploits."}, {"id": 15, "text": "Why is minimising the number of programs that run with elevated privileges a high-value hardening step?", "options": ["Elevated privileges are required for all network access", "The kernel cannot schedule privileged programs", "Privileged programs always run slower", "Each privileged program is a potential pathway for privilege escalation if it contains a vulnerability"], "correct": 3, "explanation": "Reducing the number of privileged components directly reduces the number of high-impact targets."}, {"id": 16, "text": "Which statement correctly contrasts a vulnerability with a threat?", "options": ["A vulnerability is a weakness in a system; a threat is a potential actor or event that may exploit a weakness", "A threat is a weakness; a vulnerability is an attacker", "The two terms are interchangeable", "Vulnerabilities exist only in software; threats exist only in hardware"], "correct": 0, "explanation": "Risk analysis treats threats and vulnerabilities as distinct inputs."}, {"id": 17, "text": "An OS design that places the network protocol stack entirely in the kernel increases which of the following?", "options": ["The size of the Trusted Computing Base and the impact of a bug in the protocol stack", "The difficulty of implementing new protocols", "The amount of physical memory required", "The number of system calls available to user processes"], "correct": 0, "explanation": "Code that runs in kernel mode belongs to the TCB; moving large subsystems into the kernel enlarges the TCB."}, {"id": 18, "text": "What is the primary security motivation for requiring that the reference monitor be 'small enough to be verified'?", "options": ["Smaller code always executes faster", "Large reference monitors are automatically more secure", "Verification is only possible for programs written in assembly", "A smaller code base can be subjected to more thorough analysis, testing or formal verification, increasing confidence in its correctness"], "correct": 3, "explanation": "Assurance is limited by the ability to understand and analyse the critical code."}, {"id": 19, "text": "Which of the following best describes the relationship between authentication and authorisation?", "options": ["Neither is required once a process is running", "Authorisation always precedes authentication", "Authentication establishes the identity of a subject; authorisation decides what actions that identity is permitted to perform", "They are two names for the same mechanism"], "correct": 2, "explanation": "Confusing the two concepts is a common source of design errors."}, {"id": 20, "text": "A system allows any process that knows a certain filename to open that file, regardless of the identity of the caller. Which access-control concept is missing?", "options": ["A graphical user interface", "Proper mediation of access based on subject identity or credentials", "Encryption of the file contents", "Support for multiple CPU cores"], "correct": 1, "explanation": "Knowledge of a name is not a sufficient authorisation mechanism; the reference monitor must evaluate the subject's rights."}, {"id": 21, "text": "Why can a single compromised device driver often lead to a full system compromise on a monolithic kernel?", "options": ["Drivers run in a separate virtual machine by default", "Drivers are forced to use only safe languages", "Device drivers typically execute with kernel privileges and can therefore modify any kernel data structure or page table", "The kernel automatically sandboxes every driver"], "correct": 2, "explanation": "In traditional monolithic designs, drivers are part of the TCB."}, {"id": 22, "text": "Which of the following is the strongest argument for implementing the principle of least common mechanism?", "options": ["Shared mechanisms can become unintended communication channels or single points of failure that affect many users", "Sharing always improves performance", "Shared code is easier to verify", "The principle is only relevant to distributed systems"], "correct": 0, "explanation": "Minimising shared state reduces both covert channels and the blast radius of a fault."}, {"id": 23, "text": "An examiner asks: 'Explain why the ability to load a kernel module at run time increases the attack surface.' The best answer is:", "options": ["Each additional module that can be loaded expands the set of privileged code that must be trusted and may introduce new vulnerabilities", "Kernel modules always improve performance", "Loading modules has no security implications", "Modules can only be loaded by unprivileged users"], "correct": 0, "explanation": "Dynamic loading of privileged code is a classic expansion of the TCB."}, {"id": 24, "text": "Which scenario most clearly violates the principle of psychological acceptability?", "options": ["A security mechanism is so cumbersome that legitimate users routinely circumvent it, thereby weakening overall security", "A security mechanism is invisible to the user", "A security mechanism requires a password", "A security mechanism is implemented entirely in hardware"], "correct": 0, "explanation": "If users find a control too burdensome they will bypass it, often creating larger holes."}, {"id": 25, "text": "What is the most precise definition of a 'subject' in classical access-control terminology?", "options": ["A network packet", "An active entity (user, process, thread) that can initiate requests to access objects", "Any file stored on disk", "The CPU itself"], "correct": 1, "explanation": "Subjects act; objects are acted upon."}, {"id": 26, "text": "What is the most precise definition of an 'object' in classical access-control terminology?", "options": ["Only network sockets", "A passive entity (file, memory region, device, IPC endpoint) that is accessed or manipulated by subjects", "Only interactive users", "Only the kernel"], "correct": 1, "explanation": "Objects are the resources that the security policy protects."}, {"id": 27, "text": "A design review discovers that a critical security check is performed only when a resource is first opened and is never re-evaluated later. Which principle is most directly threatened?", "options": ["Economy of mechanism", "Least privilege", "Open design", "Complete mediation"], "correct": 3, "explanation": "If the policy can change (or the subject's rights can change) after the initial check, subsequent accesses may violate the current policy."}, {"id": 28, "text": "Which of the following statements about privilege rings is correct on a modern x86-64 processor running a typical OS?", "options": ["Ring 3 is more privileged than ring 0", "Ring 0 is the most privileged (kernel); rings 1–2 are rarely used; ring 3 is used for user-mode processes", "All rings have identical privileges", "Only two rings exist and both run with equal power"], "correct": 1, "explanation": "Contemporary OSes almost always use a two-ring model (0 and 3) even though the hardware supports four."}, {"id": 29, "text": "Why is the bootloader a particularly sensitive component from a security perspective?", "options": ["It runs before the OS kernel and can, if compromised, undermine all subsequent security mechanisms including Secure Boot measurements", "It is written exclusively in a memory-safe language", "It executes only in user mode", "It never interacts with storage devices"], "correct": 0, "explanation": "Early-boot code is part of the root of trust; its integrity is a prerequisite for later security."}, {"id": 30, "text": "Which of the following is the best example of reducing the attack surface of a server?", "options": ["Uninstalling unused packages, disabling unnecessary services, closing unused ports and removing unneeded user accounts", "Adding more open ports so that traffic is distributed", "Running every service under the root account for simplicity", "Disabling the system firewall to improve performance"], "correct": 0, "explanation": "Attack-surface reduction is the systematic elimination of unneeded entry points and privileges."}, {"id": 31, "text": "A process is granted the ability to open any file whose path is supplied by an untrusted network client, without further checks. This design most directly violates:", "options": ["The need for encryption of network traffic", "The requirement that access decisions be based on the subject's credentials and the object's policy, not solely on a name supplied by an untrusted party", "The requirement that all processes run as root", "The principle that logs must be written to disk"], "correct": 1, "explanation": "Allowing an untrusted party to specify the target of a privileged operation is a classic confused-deputy / path-traversal pattern."}, {"id": 32, "text": "Which statement best captures the essence of the 'economy of mechanism' principle?", "options": ["Security mechanisms should be as simple and small as possible so that they can be easily understood and analysed", "Security mechanisms should be written in the lowest-level language available", "Security mechanisms should be duplicated many times for redundancy", "Security mechanisms should be hidden from all users"], "correct": 0, "explanation": "Complexity is the enemy of assurance."}, {"id": 33, "text": "An OS maintains a global table of open file descriptors that is readable by every process. Which security principle is most clearly violated?", "options": ["Psychological acceptability", "Open design", "Fail-safe defaults", "Least common mechanism (and implicitly isolation)"], "correct": 3, "explanation": "A globally readable table of other processes' open files creates an information channel and a potential attack surface."}, {"id": 34, "text": "Why do many secure-system designs insist that the reference-validation mechanism be implemented in a way that cannot be bypassed?", "options": ["The reference monitor is only advisory", "Bypass is required for performance", "If a subject can obtain access to an object without invoking the reference monitor, the security policy is no longer enforced", "Bypass is needed for device drivers"], "correct": 2, "explanation": "Always-invoked is one of the three classic reference-monitor requirements."}, {"id": 35, "text": "Which of the following is a realistic limitation of relying solely on security through obscurity?", "options": ["Obscurity is incompatible with encryption", "Obscurity always increases the size of the TCB", "Once the secret design details become known (through reverse engineering, leaks or insider disclosure), the protection collapses", "Obscurity can never be combined with other controls"], "correct": 2, "explanation": "Obscurity may raise the bar temporarily but does not provide robust, long-term security."}, {"id": 36, "text": "A kernel developer adds a new system call that accepts a user-supplied pointer and writes kernel data to it without verifying the pointer's validity. What class of vulnerability has been introduced?", "options": ["An encryption-strength weakness", "A memory-safety / validation error that can lead to arbitrary kernel-memory writes", "A pure denial-of-service vulnerability with no further impact", "A user-interface defect"], "correct": 1, "explanation": "Failing to validate user-supplied addresses is a classic source of kernel privilege-escalation bugs."}, {"id": 37, "text": "Which of the following best describes the security benefit of running a service under a dedicated, low-privilege user account?", "options": ["Even if the service is fully compromised, the attacker inherits only the limited rights of that account rather than full system control", "The service no longer needs to be patched", "The service becomes immune to all memory-corruption bugs", "The service will automatically be scheduled with higher priority"], "correct": 0, "explanation": "Least-privilege accounts contain the blast radius of a compromise."}, {"id": 38, "text": "What is the most accurate characterisation of 'defence in depth'?", "options": ["Security is implemented only at the network perimeter", "Multiple independent layers of security controls are deployed so that the failure or bypass of one layer does not result in a complete compromise", "All controls are concentrated inside the kernel", "A single very strong control is used exclusively"], "correct": 1, "explanation": "Defence in depth accepts that individual controls can fail and therefore provides overlapping protection."}, {"id": 39, "text": "An auditor discovers that a critical configuration file is world-writable. Which security goal is most immediately endangered?", "options": ["Only confidentiality of network traffic", "Only availability", "Only the performance of the disk subsystem", "Integrity (and potentially confidentiality and availability as secondary effects)"], "correct": 3, "explanation": "World-writable configuration files allow unauthorised modification, which is an integrity violation that can cascade into other failures."}, {"id": 40, "text": "Why is the distinction between 'policy' and 'mechanism' important in OS security architecture?", "options": ["Policy and mechanism are always identical", "The distinction is only relevant to network protocols", "Mechanism is written by management; policy is written by programmers", "Policy expresses the high-level rules (what is allowed); mechanism is the concrete implementation that enforces those rules; separating them improves flexibility and assurance"], "correct": 3, "explanation": "Clear separation allows the same mechanisms to enforce different policies and makes both easier to reason about."}, {"id": 41, "text": "Which of the following is the strongest reason for keeping the Trusted Computing Base as small as practical?", "options": ["A smaller TCB is required by the POSIX standard", "A smaller TCB eliminates the need for authentication", "A smaller TCB reduces the number of components that must be correct for the system to be secure and makes thorough verification more feasible", "A smaller TCB always executes faster"], "correct": 2, "explanation": "Assurance effort scales with the size and complexity of the TCB."}, {"id": 42, "text": "A process is allowed to create a setuid-root executable. Why is this capability itself a security-sensitive operation?", "options": ["The resulting executable will run with elevated privileges for any user who executes it, thereby expanding the set of privileged code", "Setuid executables are always slower", "Setuid has no privilege implications", "Setuid is required for every network service"], "correct": 0, "explanation": "The ability to introduce new privileged programs is itself a form of privilege and must be controlled."}, {"id": 43, "text": "Which of the following statements about user mode versus kernel mode is FALSE?", "options": ["Interrupts are typically handled in kernel mode", "Device registers are normally accessible only in kernel mode", "Code running in user mode may freely modify kernel page tables", "A mode switch occurs on every system call"], "correct": 2, "explanation": "User-mode code is prevented by hardware from modifying kernel page tables; that is a fundamental protection."}, {"id": 44, "text": "What is the primary security purpose of the 'separation of duties' principle?", "options": ["To make every task require exactly two people", "To ensure that no single individual can both initiate and approve a critical action, thereby reducing the risk of fraud or unilateral abuse", "To eliminate the need for audit logs", "To force all administrators to share a single account"], "correct": 1, "explanation": "Separation of duties is a classic organisational and technical control against insider abuse."}, {"id": 45, "text": "An OS allows a user-mode process to map arbitrary physical memory pages into its address space. What is the most severe consequence?", "options": ["The mapping is purely a performance optimisation with no security effect", "The process can read or modify kernel memory and the memory of any other process, completely defeating isolation", "The process is automatically terminated", "The process can only read its own memory"], "correct": 1, "explanation": "Unrestricted physical-memory mapping collapses the entire virtual-memory protection model."}, {"id": 46, "text": "Which of the following is the best example of an 'object-reuse' vulnerability?", "options": ["A compiler re-uses intermediate files", "A process re-uses the same TCP port after a timeout", "A newly allocated memory page or disk block still contains data left by a previous process or user", "A user re-uses the same password on multiple systems"], "correct": 2, "explanation": "Object-reuse controls require that storage be sanitised before being reallocated to a new subject."}, {"id": 47, "text": "Why is the ability to debug (ptrace) another process considered security-sensitive?", "options": ["Only the kernel can be debugged", "Debugging has no interaction with memory protection", "A debugger can read and write the target process's memory and registers, effectively obtaining the same privileges as the target", "Debugging always improves the security of the target"], "correct": 2, "explanation": "Most systems therefore restrict ptrace to processes owned by the same user or to root."}, {"id": 48, "text": "Which design choice most effectively supports the principle of least privilege for a long-running network service?", "options": ["The service periodically elevates its privileges", "The service starts with the privileges it needs, then permanently drops all unnecessary privileges before accepting network connections", "The service runs as root for its entire lifetime", "The service never opens any files"], "correct": 1, "explanation": "Privilege dropping after initialisation is a standard hardening pattern."}, {"id": 49, "text": "A security mechanism is described as 'non-bypassable'. What does this guarantee?", "options": ["The mechanism is implemented in hardware only", "There is no path by which a subject can access an object without the mechanism being invoked", "The mechanism ignores the security policy", "The mechanism can never be updated"], "correct": 1, "explanation": "Non-bypassability is synonymous with the 'always invoked' requirement of the reference monitor."}, {"id": 50, "text": "Which of the following most accurately describes the relationship between the reference monitor and the security kernel?", "options": ["The reference monitor is always larger than the security kernel", "The security kernel exists only in microkernels", "They are unrelated concepts", "The security kernel is the concrete implementation of the reference-monitor concept together with other critical protection mechanisms"], "correct": 3, "explanation": "In the classic literature the security kernel realises the reference monitor and related functions."}]}, {"moduleNumber": 2, "title": "Chapter 2: The Three Security Goals – Confidentiality, Integrity & Availability", "questions": [{"id": 1, "text": "A system encrypts all files at rest but stores the encryption keys in a world-readable file. Which CIA property is most directly undermined?", "options": ["None; the system remains fully secure", "Availability – encryption keys have no relationship to availability", "Integrity – encryption never affects integrity", "Confidentiality – because possession of the ciphertext plus the key yields the plaintext"], "correct": 3, "explanation": "Encryption without proper key protection provides only a false sense of confidentiality."}, {"id": 2, "text": "Which of the following attacks primarily targets integrity rather than confidentiality or availability?", "options": ["An adversary who floods a server with traffic until it is unreachable", "An adversary who reads a confidential database", "An adversary who steals a backup tape", "An adversary who silently modifies the contents of a software update before it is installed"], "correct": 3, "explanation": "Unauthorised modification is the definition of an integrity violation."}, {"id": 3, "text": "A hospital system prioritises availability of patient records during an emergency even if that temporarily weakens access controls. This is an example of:", "options": ["A deliberate, context-dependent trade-off among the three CIA goals", "A complete abandonment of security", "A situation in which CIA analysis is irrelevant", "A pure confidentiality requirement"], "correct": 0, "explanation": "Real systems often have to balance the three goals; the appropriate balance is policy-driven."}, {"id": 4, "text": "Why does the Biba model enforce 'no read down'?", "options": ["To guarantee availability of low-integrity data", "To prevent a high-integrity process from being contaminated by data from a lower-integrity source", "To protect confidentiality of high-level data", "To enforce separation of duties"], "correct": 1, "explanation": "Biba's integrity lattice is the dual of Bell-LaPadula's confidentiality lattice."}, {"id": 5, "text": "Which statement correctly characterises the Clark-Wilson model's approach to integrity?", "options": ["Integrity is preserved by encrypting every data item", "Integrity is preserved by permitting only well-formed transactions executed by authorised users, together with separation of duties", "Integrity is preserved solely by assigning numeric integrity levels to subjects and objects", "Integrity is not addressed by Clark-Wilson"], "correct": 1, "explanation": "Clark-Wilson is oriented toward commercial integrity requirements rather than military-style lattices."}, {"id": 6, "text": "An attacker obtains a read-only replica of a database that is several hours out of date. Which CIA property has been violated?", "options": ["No CIA property is affected", "Confidentiality (and possibly integrity of the organisation's information advantage), but not necessarily the integrity of the live system", "Only the integrity of the live production database", "Only availability"], "correct": 1, "explanation": "Disclosure of sensitive data, even if stale, is a confidentiality failure."}, {"id": 7, "text": "Which of the following is the most accurate description of a 'threat model'?", "options": ["A structured representation of the adversaries, their capabilities, goals and the assets they are expected to target", "A list of all open network ports", "A complete formal proof of security", "A catalogue of every possible software bug"], "correct": 0, "explanation": "Threat modelling guides the selection and prioritisation of countermeasures."}, {"id": 8, "text": "A control that detects unauthorised modification of system binaries primarily supports which CIA goal?", "options": ["Confidentiality", "Integrity", "Availability", "Non-repudiation only"], "correct": 1, "explanation": "Detection of modification is a classic integrity mechanism."}, {"id": 9, "text": "Why can an over-strong confidentiality control (for example, extremely complex multi-factor authentication on every read) sometimes harm availability?", "options": ["Strong authentication always improves availability", "Confidentiality controls never affect availability", "Availability is only threatened by hardware failure", "Legitimate users may be unable to obtain the data they need in a timely manner, or may be locked out entirely"], "correct": 3, "explanation": "The three CIA goals can conflict; good design requires explicit trade-offs."}, {"id": 10, "text": "Which of the following best illustrates a failure of the 'need-to-know' principle?", "options": ["A system administrator can reboot a server", "A user can change their own password", "A backup operator can write to backup media", "A junior clerk is given unrestricted read access to every patient's full medical history even though their job only requires access to billing codes"], "correct": 3, "explanation": "Need-to-know restricts access to the minimum information required for a legitimate purpose."}, {"id": 11, "text": "The Chinese Wall model is primarily intended to protect which security property in a commercial setting?", "options": ["Integrity of numerical calculations", "Non-repudiation of stock trades", "Availability of trading systems", "Confidentiality in the presence of conflicts of interest"], "correct": 3, "explanation": "By dynamically building walls based on prior accesses, the model prevents a consultant from acting for competing clients."}, {"id": 12, "text": "Which of the following is a realistic example of an availability attack that does not involve flooding a network?", "options": ["A passive wiretap on a network link", "Ransomware that encrypts the victim's files and withholds the decryption key", "Reading a world-readable configuration file", "Changing a user's login shell"], "correct": 1, "explanation": "Ransomware is fundamentally an availability (and often integrity) attack."}, {"id": 13, "text": "A system uses digital signatures on every software package. What is the primary CIA goal being supported?", "options": ["Confidentiality of the package contents", "Integrity (and origin authentication)", "Availability of the download server", "Performance of the package manager"], "correct": 1, "explanation": "A signature allows the recipient to detect modification and to verify the signer's identity."}, {"id": 14, "text": "Which statement about the relationship between integrity and confidentiality is correct?", "options": ["Encryption is sufficient for both properties under all circumstances", "Mechanisms that protect integrity (e.g., MACs, signatures) do not by themselves protect confidentiality, and vice versa", "Confidentiality and integrity are identical properties", "Any mechanism that protects integrity automatically protects confidentiality"], "correct": 1, "explanation": "The two properties are distinct and usually require distinct mechanisms."}, {"id": 15, "text": "An organisation decides that the integrity of audit logs is more important than their confidentiality. Which technical measure is most appropriate?", "options": ["Storing the logs only in volatile memory", "Deleting the logs every hour", "Append-only storage or cryptographic chaining that detects any modification or deletion, even if the log contents are readable by administrators", "Encrypting the logs with a key known only to one person"], "correct": 2, "explanation": "Integrity of logs is essential for accountability; confidentiality is often secondary."}, {"id": 16, "text": "Why is 'non-repudiation' sometimes treated as an extension of the classic CIA triad?", "options": ["It provides assurance that a particular subject performed a particular action and cannot later deny it, supporting both integrity and accountability", "It replaces the need for availability", "It is identical to confidentiality", "It is only relevant to paper documents"], "correct": 0, "explanation": "Non-repudiation is typically achieved with digital signatures and secure audit trails."}, {"id": 17, "text": "A process is allowed to write to a high-integrity log file but is not allowed to read it. This policy is characteristic of which model?", "options": ["Chinese Wall", "Bell-LaPadula", "Biba (or a similar integrity policy that permits 'write up')", "Pure DAC"], "correct": 2, "explanation": "Biba's 'no read down / write up' rules produce exactly this pattern for integrity."}, {"id": 18, "text": "Which of the following is the best example of a control that simultaneously supports confidentiality and integrity?", "options": ["A process that runs with unlimited privileges", "A simple open TCP port", "An authenticated, encrypted channel (e.g., TLS) that protects data in transit from both eavesdropping and tampering", "A world-writable shared directory"], "correct": 2, "explanation": "Modern cryptographic protocols are designed to provide both properties."}, {"id": 19, "text": "An attacker who can only observe network traffic but cannot modify it is primarily a threat to:", "options": ["Confidentiality", "Availability", "Non-repudiation only", "Integrity"], "correct": 0, "explanation": "Passive observation yields information disclosure."}, {"id": 20, "text": "Which of the following statements about formal security models is most accurate?", "options": ["They provide a mathematical framework in which security properties can be precisely defined and, in some cases, proven", "They are only applicable to network protocols", "They eliminate the need for testing and code review", "They guarantee that an implementation is free of bugs"], "correct": 0, "explanation": "Models are tools for reasoning; they do not automatically produce correct implementations."}, {"id": 21, "text": "A system that is highly available but whose data can be read by any authenticated user may still be unacceptable for which reason?", "options": ["Authentication is never required", "Availability is the only property that matters", "It fails to provide adequate confidentiality for sensitive data", "High availability automatically implies high confidentiality"], "correct": 2, "explanation": "All three CIA properties must be evaluated against the system's requirements."}, {"id": 22, "text": "Which of the following best describes the purpose of an integrity model such as Biba or Clark-Wilson?", "options": ["To maximise system uptime", "To define rules that prevent unauthorised or improper modification of data and system state", "To guarantee that data is never disclosed", "To replace authentication"], "correct": 1, "explanation": "Integrity models focus on the correctness and trustworthiness of data."}, {"id": 23, "text": "An organisation backs up its data every night but never tests restoration. Which CIA property is most at risk?", "options": ["Confidentiality of the backup media", "None; untested backups are always reliable", "Availability – because the backups may be unusable when needed", "Integrity of the live production data"], "correct": 2, "explanation": "Untested backups are a classic availability failure waiting to happen."}, {"id": 24, "text": "Why might a military system choose Bell-LaPadula while a bank chooses Clark-Wilson?", "options": ["Clark-Wilson cannot be implemented on modern hardware", "The two models are interchangeable", "Bell-LaPadula is optimised for multilevel confidentiality; Clark-Wilson is optimised for commercial integrity and well-formed transactions", "Banks are required by law to use Bell-LaPadula"], "correct": 2, "explanation": "Different environments emphasise different security properties."}, {"id": 25, "text": "Which of the following is a subtle way in which an availability attack can also damage integrity?", "options": ["A resource-exhaustion attack forces an administrator to restore from an older backup, losing recent legitimate changes", "Availability attacks never affect integrity", "Integrity is only threatened by encryption", "Backups are never used during availability incidents"], "correct": 0, "explanation": "Secondary effects of availability failures can include integrity loss."}, {"id": 26, "text": "A control that prevents a low-integrity process from sending messages to a high-integrity process is an application of:", "options": ["A pure confidentiality policy", "An integrity policy (similar to Biba's no-write-up or no-read-down rules)", "An availability-only policy", "Discretionary access control only"], "correct": 1, "explanation": "Information-flow control for integrity restricts the direction of data movement."}, {"id": 27, "text": "Which of the following is the most accurate statement about the Chinese Wall model's dynamic nature?", "options": ["The model only applies to network traffic", "The model ignores the notion of conflict-of-interest classes", "Access rights are completely static and assigned at account creation", "Access rights of a subject change over time as a function of the objects the subject has already accessed"], "correct": 3, "explanation": "History-based access control is the defining characteristic of the Chinese Wall model."}, {"id": 28, "text": "An attacker replaces a legitimate shared library with a malicious one of the same name. Which CIA properties are threatened?", "options": ["Only confidentiality of network traffic", "Integrity (of the system) and potentially confidentiality and availability of any process that loads the library", "No CIA property is affected", "Only the availability of the disk"], "correct": 1, "explanation": "Library substitution is a classic integrity attack with broad consequences."}, {"id": 29, "text": "Why is 'defence in depth' particularly relevant when trying to protect all three CIA properties?", "options": ["Defence in depth increases the attack surface", "Defence in depth is only relevant to confidentiality", "A single strong control is always enough", "No single control is usually sufficient to protect confidentiality, integrity and availability against a capable adversary; overlapping controls compensate for individual weaknesses"], "correct": 3, "explanation": "Layered controls address the reality that individual mechanisms have limitations."}, {"id": 30, "text": "Which of the following is a realistic example of a control that primarily supports availability?", "options": ["Automatic failover to a hot standby system together with regular, tested backups", "A stricter SELinux policy that denies all network access", "A more complex password policy", "A longer AES key"], "correct": 0, "explanation": "Redundancy and recovery are the classic availability controls."}, {"id": 31, "text": "A system that correctly implements Bell-LaPadula can still suffer from integrity violations. Why?", "options": ["Bell-LaPadula automatically enforces Biba as well", "Bell-LaPadula constrains information flow for confidentiality but does not enforce integrity rules; a separate integrity model is required", "Bell-LaPadula systems are immune to all attacks", "Integrity is not a meaningful property"], "correct": 1, "explanation": "Confidentiality models and integrity models address orthogonal concerns."}, {"id": 32, "text": "Which of the following best explains why encryption alone does not provide integrity?", "options": ["Integrity is only relevant to plaintext", "Modern ciphers are immune to modification", "Encryption always provides integrity", "An attacker can still modify ciphertext (or replace it with previously observed ciphertext) unless an authenticity mechanism such as a MAC or AEAD construction is also used"], "correct": 3, "explanation": "Classic counter-examples include bit-flipping attacks on malleable encryption modes."}, {"id": 33, "text": "An organisation classifies data into 'public', 'internal' and 'secret'. This classification scheme is most directly aimed at supporting:", "options": ["Only integrity", "Only availability", "Confidentiality (by enabling policy that restricts read access according to sensitivity)", "Only performance tuning"], "correct": 2, "explanation": "Data classification is a prerequisite for most confidentiality policies."}, {"id": 34, "text": "Which of the following is the best description of 'risk' in the context of the CIA triad?", "options": ["The size of the source code", "The number of users on the system", "The total number of open ports", "A function of the likelihood that a threat will exploit a vulnerability and the impact that would have on confidentiality, integrity or availability"], "correct": 3, "explanation": "Risk assessment combines threats, vulnerabilities and impact on the organisation's assets."}, {"id": 35, "text": "A process running at a high integrity level is allowed to read a low-integrity file and then write to a high-integrity file. Which model does this behaviour violate?", "options": ["Pure DAC", "Bell-LaPadula", "Chinese Wall", "Biba (because of the 'no read down' rule)"], "correct": 3, "explanation": "Reading low-integrity data and then writing high-integrity data would contaminate the high-integrity object."}, {"id": 36, "text": "Why might an organisation accept a lower level of confidentiality for certain operational data during a crisis?", "options": ["Because confidentiality is never important", "Because the availability of that data to responders may temporarily outweigh the confidentiality risk", "Because encryption becomes impossible during crises", "Because crises eliminate all security requirements"], "correct": 1, "explanation": "Security policy can include contingency rules that re-balance CIA priorities under defined emergency conditions."}, {"id": 37, "text": "Which of the following is a common misconception about the CIA triad?", "options": ["That availability can be supported by redundancy", "That the three properties are always mutually reinforcing and never require trade-offs", "That confidentiality can be supported by encryption", "That integrity can be supported by checksums"], "correct": 1, "explanation": "In practice the three goals frequently conflict and must be balanced according to context."}, {"id": 38, "text": "An attacker who can delete or truncate audit logs is primarily attacking which property of the logging system?", "options": ["No security property", "Integrity (and secondarily the availability of forensic evidence)", "Only the confidentiality of the logs", "Only the performance of the disk"], "correct": 1, "explanation": "Tamper-evident, append-only logs are designed precisely to protect integrity."}, {"id": 39, "text": "Which of the following controls most directly supports the 'I' in CIA for a public software distribution?", "options": ["Requiring users to solve a CAPTCHA before download", "Hosting the binaries on a high-bandwidth CDN", "Encrypting the binaries with a secret key", "Publishing cryptographic hashes or digital signatures of the released binaries"], "correct": 3, "explanation": "Hashes and signatures allow users to detect modification."}, {"id": 40, "text": "A system that is 'highly confidential' but frequently unavailable may still fail to meet business requirements because:", "options": ["Confidentiality is the only property that matters", "Availability is automatically satisfied by confidentiality", "Users cannot obtain the information they are authorised to see when they need it", "Business requirements never include availability"], "correct": 2, "explanation": "All three properties must be present in the proportions required by the mission."}, {"id": 41, "text": "Which of the following is the most precise statement about the Chinese Wall model's conflict-of-interest classes?", "options": ["All companies in the world belong to a single class", "Conflict-of-interest classes are irrelevant to the model", "Classes are assigned randomly at login", "Companies that compete with one another are placed in the same class; once a subject accesses one company in a class, access to the others is blocked"], "correct": 3, "explanation": "The partitioning into COI classes is what makes the dynamic wall construction possible."}, {"id": 42, "text": "Why is it insufficient to protect only data at rest and data in transit, ignoring data in use?", "options": ["Data in use is automatically encrypted by the CPU", "Operating systems make data in use impossible to access", "While data is being processed it resides in memory (and possibly CPU registers) where it can be read or modified by a compromised process or by certain side-channel attacks", "Data in use never contains sensitive information"], "correct": 2, "explanation": "Confidential computing and related technologies attempt to close this gap."}, {"id": 43, "text": "Which of the following best illustrates a situation in which integrity is more important than confidentiality?", "options": ["A public election system whose results must be accurate and trustworthy even though the individual votes may not be secret after the election", "A private medical record", "A military intelligence database", "A password file"], "correct": 0, "explanation": "Different applications weight the three properties differently."}, {"id": 44, "text": "An attacker forces a system to restore from a backup that was taken before a legitimate, authorised change. Which properties have been affected?", "options": ["No security-relevant property", "Only the performance of the restore process", "Only confidentiality", "Integrity of the current system state and potentially availability of the newer data"], "correct": 3, "explanation": "Rolling back authorised changes is an integrity (and sometimes availability) failure."}, {"id": 45, "text": "Which of the following is a correct statement about the relationship between authentication and the CIA triad?", "options": ["Authentication is a supporting mechanism that enables the enforcement of confidentiality, integrity and accountability policies; it is not itself one of the three CIA properties", "The CIA triad includes authentication as a fourth element", "Authentication replaces the need for integrity controls", "Authentication is identical to confidentiality"], "correct": 0, "explanation": "Classic CIA does not list authentication; authentication is a means rather than an end."}, {"id": 46, "text": "A system implements mandatory access control for confidentiality but allows any process to modify any world-writable temporary directory. What is the most accurate assessment?", "options": ["The system is fully secure because MAC is present", "Confidentiality may be well protected while integrity (and potentially availability) remain weak", "World-writable directories improve confidentiality", "MAC automatically protects integrity"], "correct": 1, "explanation": "MAC for confidentiality does not automatically confer integrity protection."}, {"id": 47, "text": "Which of the following is the best example of a pure availability control that does not directly improve confidentiality or integrity?", "options": ["Deploying geographically distributed replicas with automatic failover", "Encrypting all network traffic", "Enforcing a strict SELinux policy", "Digitally signing every configuration file"], "correct": 0, "explanation": "Geographic redundancy is aimed squarely at availability."}, {"id": 48, "text": "Why do many modern cryptographic protocols provide authenticated encryption (AEAD) rather than encryption alone?", "options": ["AEAD simultaneously protects confidentiality and integrity (and authenticity) of the data", "AEAD is required only for performance", "Encryption alone is always sufficient", "Integrity is irrelevant for network traffic"], "correct": 0, "explanation": "Malleable encryption schemes can be attacked even when the attacker cannot decrypt."}, {"id": 49, "text": "A system encrypts all files at rest but stores the encryption keys in a world-readable file. Which CIA property is most directly undermined – further analysis 49?", "options": ["None; the system remains fully secure", "Availability – encryption keys have no relationship to availability", "Integrity – encryption never affects integrity", "Confidentiality – because possession of the ciphertext plus the key yields the plaintext"], "correct": 3, "explanation": "Encryption without proper key protection provides only a false sense of confidentiality."}, {"id": 50, "text": "A system encrypts all files at rest but stores the encryption keys in a world-readable file. Which CIA property is most directly undermined – further analysis 50?", "options": ["None; the system remains fully secure", "Availability – encryption keys have no relationship to availability", "Integrity – encryption never affects integrity", "Confidentiality – because possession of the ciphertext plus the key yields the plaintext"], "correct": 3, "explanation": "Encryption without proper key protection provides only a false sense of confidentiality."}]}, {"moduleNumber": 3, "title": "Chapter 3: OS Security Architecture", "questions": [{"id": 1, "text": "Which of the following statements about the reference monitor is most accurate in a modern OS security context?", "options": ["Its size is irrelevant to assurance", "It only needs to be invoked for network accesses", "It can be freely modified by any administrator", "It must be always invoked, tamper-proof and small enough to be subjected to complete analysis"], "correct": 3, "explanation": "The three classic requirements are the foundation of high-assurance design."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with the Trusted Computing Base. The best answer is:", "options": ["The TCB is identical to the BIOS", "The TCB includes every user application", "A larger TCB is always more secure", "Its size and complexity directly affect the feasibility of verification and the residual risk"], "correct": 3, "explanation": "Minimising and hardening the TCB is a central goal."}, {"id": 3, "text": "Which scenario most clearly demonstrates a failure or misuse of kernel versus user mode?", "options": ["The two modes are purely a software convention", "Hardware-enforced mode bits prevent user-mode code from executing privileged instructions or touching kernel memory", "Mode switches never occur on system calls", "User mode is more privileged than kernel mode"], "correct": 1, "explanation": "Privilege rings are the hardware root of isolation."}, {"id": 4, "text": "When comparing least privilege with related mechanisms, which distinction is the most security-relevant?", "options": ["Even a fully compromised component can only exercise the rights it was granted, limiting blast radius", "It only applies to network services", "It requires every process to run as root", "It is incompatible with usability"], "correct": 0, "explanation": "Least privilege is one of the most effective risk-reduction strategies."}, {"id": 5, "text": "A system designer claims that defence in depth alone is sufficient to guarantee security. The strongest counter-argument is:", "options": ["It is only relevant to physical security", "A single perfect control is always preferable", "It increases the attack surface", "Overlapping controls compensate for the inevitable weaknesses or failures of any single control"], "correct": 3, "explanation": "Real systems are built on the assumption that individual layers can fail."}, {"id": 6, "text": "Which of the following is a realistic attack or failure mode that complete mediation is intended to mitigate?", "options": ["Mediation can be skipped for performance", "Every access to every object must be checked; cached decisions are valid only while the policy cannot have changed", "Mediation is required only for write operations", "Only the first access needs to be checked"], "correct": 1, "explanation": "Incomplete mediation is a classic source of security holes."}, {"id": 7, "text": "In a high-assurance evaluation, which property of economy of mechanism would receive the most scrutiny?", "options": ["Complexity is a reliable source of security", "Mechanisms should be duplicated many times", "The principle only applies to cryptography", "Simple mechanisms are easier to implement correctly, to analyse and to maintain"], "correct": 3, "explanation": "Complexity is the enemy of assurance."}, {"id": 8, "text": "Which of the following best explains why fail-safe defaults must be combined with other controls rather than used in isolation?", "options": ["The absence of a permission should result in allowance", "Defaults are irrelevant to security", "Fail-safe defaults require hardware support", "The absence of an explicit permission should result in denial, so that configuration errors tend toward safety"], "correct": 3, "explanation": "Fail-safe defaults turn many mistakes into safe outcomes."}, {"id": 9, "text": "An attacker who has already obtained limited access is most likely to attempt to subvert open design by:", "options": ["Security should rest on the secrecy of keys or other protected data, not on the secrecy of the algorithms or design", "All design details must be kept secret", "The principle forbids the use of cryptography", "Open-source software cannot be secure"], "correct": 0, "explanation": "Kerckhoffs's principle is the cryptographic expression of open design."}, {"id": 10, "text": "Which of the following is a common misconception about separation of duties that can lead to insecure deployments?", "options": ["It eliminates the need for logging", "It is only an organisational concern and has no technical realisation", "Every action must be performed by exactly two people", "No single individual should be able both to initiate and to authorise a critical action"], "correct": 3, "explanation": "Both procedural and technical mechanisms can enforce separation of duties."}, {"id": 11, "text": "Which of the following statements about the reference monitor is most accurate in a modern OS security context (consideration 1)?", "options": ["It must be always invoked, tamper-proof and small enough to be subjected to complete analysis", "Its size is irrelevant to assurance", "It only needs to be invoked for network accesses", "It can be freely modified by any administrator"], "correct": 0, "explanation": "The three classic requirements are the foundation of high-assurance design."}, {"id": 12, "text": "An examiner asks you to identify a subtle limitation or risk associated with the Trusted Computing Base. The best answer is: (consideration 1)?", "options": ["The TCB includes every user application", "A larger TCB is always more secure", "Its size and complexity directly affect the feasibility of verification and the residual risk", "The TCB is identical to the BIOS"], "correct": 2, "explanation": "Minimising and hardening the TCB is a central goal."}, {"id": 13, "text": "Which scenario most clearly demonstrates a failure or misuse of kernel versus user mode (consideration 1)?", "options": ["Mode switches never occur on system calls", "User mode is more privileged than kernel mode", "Hardware-enforced mode bits prevent user-mode code from executing privileged instructions or touching kernel memory", "The two modes are purely a software convention"], "correct": 2, "explanation": "Privilege rings are the hardware root of isolation."}, {"id": 14, "text": "When comparing least privilege with related mechanisms, which distinction is the most security-relevant (consideration 1)?", "options": ["It only applies to network services", "It requires every process to run as root", "It is incompatible with usability", "Even a fully compromised component can only exercise the rights it was granted, limiting blast radius"], "correct": 3, "explanation": "Least privilege is one of the most effective risk-reduction strategies."}, {"id": 15, "text": "A system designer claims that defence in depth alone is sufficient to guarantee security. The strongest counter-argument is: (consideration 1)?", "options": ["A single perfect control is always preferable", "It is only relevant to physical security", "Overlapping controls compensate for the inevitable weaknesses or failures of any single control", "It increases the attack surface"], "correct": 2, "explanation": "Real systems are built on the assumption that individual layers can fail."}, {"id": 16, "text": "Which of the following is a realistic attack or failure mode that complete mediation is intended to mitigate (consideration 1)?", "options": ["Mediation is required only for write operations", "Only the first access needs to be checked", "Mediation can be skipped for performance", "Every access to every object must be checked; cached decisions are valid only while the policy cannot have changed"], "correct": 3, "explanation": "Incomplete mediation is a classic source of security holes."}, {"id": 17, "text": "In a high-assurance evaluation, which property of economy of mechanism would receive the most scrutiny (consideration 1)?", "options": ["Simple mechanisms are easier to implement correctly, to analyse and to maintain", "Mechanisms should be duplicated many times", "Complexity is a reliable source of security", "The principle only applies to cryptography"], "correct": 0, "explanation": "Complexity is the enemy of assurance."}, {"id": 18, "text": "Which of the following best explains why fail-safe defaults must be combined with other controls rather than used in isolation (consideration 1)?", "options": ["The absence of a permission should result in allowance", "Fail-safe defaults require hardware support", "The absence of an explicit permission should result in denial, so that configuration errors tend toward safety", "Defaults are irrelevant to security"], "correct": 2, "explanation": "Fail-safe defaults turn many mistakes into safe outcomes."}, {"id": 19, "text": "An attacker who has already obtained limited access is most likely to attempt to subvert open design by: (consideration 1)?", "options": ["The principle forbids the use of cryptography", "Security should rest on the secrecy of keys or other protected data, not on the secrecy of the algorithms or design", "Open-source software cannot be secure", "All design details must be kept secret"], "correct": 1, "explanation": "Kerckhoffs's principle is the cryptographic expression of open design."}, {"id": 20, "text": "Which of the following is a common misconception about separation of duties that can lead to insecure deployments (consideration 1)?", "options": ["No single individual should be able both to initiate and to authorise a critical action", "It is only an organisational concern and has no technical realisation", "Every action must be performed by exactly two people", "It eliminates the need for logging"], "correct": 0, "explanation": "Both procedural and technical mechanisms can enforce separation of duties."}, {"id": 21, "text": "Which of the following statements about the reference monitor is most accurate in a modern OS security context (consideration 2)?", "options": ["It only needs to be invoked for network accesses", "Its size is irrelevant to assurance", "It can be freely modified by any administrator", "It must be always invoked, tamper-proof and small enough to be subjected to complete analysis"], "correct": 3, "explanation": "The three classic requirements are the foundation of high-assurance design."}, {"id": 22, "text": "An examiner asks you to identify a subtle limitation or risk associated with the Trusted Computing Base. The best answer is: (consideration 2)?", "options": ["The TCB includes every user application", "Its size and complexity directly affect the feasibility of verification and the residual risk", "The TCB is identical to the BIOS", "A larger TCB is always more secure"], "correct": 1, "explanation": "Minimising and hardening the TCB is a central goal."}, {"id": 23, "text": "Which scenario most clearly demonstrates a failure or misuse of kernel versus user mode (consideration 2)?", "options": ["Mode switches never occur on system calls", "Hardware-enforced mode bits prevent user-mode code from executing privileged instructions or touching kernel memory", "User mode is more privileged than kernel mode", "The two modes are purely a software convention"], "correct": 1, "explanation": "Privilege rings are the hardware root of isolation."}, {"id": 24, "text": "When comparing least privilege with related mechanisms, which distinction is the most security-relevant (consideration 2)?", "options": ["Even a fully compromised component can only exercise the rights it was granted, limiting blast radius", "It requires every process to run as root", "It is incompatible with usability", "It only applies to network services"], "correct": 0, "explanation": "Least privilege is one of the most effective risk-reduction strategies."}, {"id": 25, "text": "A system designer claims that defence in depth alone is sufficient to guarantee secur ined limited access is most likely to attempt to subvert open design by: (consideration 4)?", "options": ["The principle forbids the use of cryptography", "Security should rest on the secrecy of keys or other protected data, not on the secrecy of the algorithms or design", "All design details must be kept secret", "Open-source software cannot be secure"], "correct": 1, "explanation": "Kerckhoffs's principle is the cryptographic expression of open design."}, {"id": 50, "text": "Which of the following is a common misconception about separation of duties that can lead to insecure deployments (consideration 4)?", "options": ["It is only an organisational concern and has no technical realisation", "No single individual should be able both to initiate and to authorise a critical action", "It eliminates the need for logging", "Every action must be performed by exactly two people"], "correct": 1, "explanation": "Both procedural and technical mechanisms can enforce separation of duties."}]}, {"moduleNumber": 4, "title": "Chapter 4: Access Control Models", "questions": [{"id": 1, "text": "Which of the following statements about Discretionary Access Control (DAC) is most accurate in a modern OS security context?", "options": ["DAC is identical to mandatory access control", "DAC cannot be implemented with ACLs", "The owner of an object can grant or revoke access at will, which is flexible but can lead to unrestricted propagation of rights", "DAC decisions are made solely by a central security officer"], "correct": 2, "explanation": "The discretionary nature is both DAC's strength and its principal weakness."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with Mandatory Access Control (MAC). The best answer is:", "options": ["Users can freely change the policy for objects they own", "MAC is only used for printing", "Access decisions are imposed by the system according to a central policy that ordinary users cannot override", "MAC eliminates the need for authentication"], "correct": 2, "explanation": "SELinux, AppArmor and traditional multilevel security systems are examples of MAC."}, {"id": 3, "text": "Which scenario most clearly demonstrates a failure or misuse of Role-Based Access Control (RBAC)?", "options": ["Permissions are associated with roles; users acquire permissions by being assigned to roles, simplifying administration at scale", "Roles are identical to groups in every respect", "Each user must be given a unique set of permissions", "RBAC cannot express separation of duties"], "correct": 0, "explanation": "RBAC is the dominant model in large enterprise systems."}, {"id": 4, "text": "When comparing Access Control Lists (ACLs) with related mechanisms, which distinction is the most security-relevant?", "options": ["ACLs are used exclusively for network filtering", "ACLs cannot express group membership", "ACLs are stored only in the kernel's CPU registers", "Each object carries a list of subjects (or groups) together with the operations those subjects may perform"], "correct": 3, "explanation": "ACLs are the most common concrete realisation of both DAC and some MAC policies."}, {"id": 5, "text": "A system designer claims that capabilities alone is sufficient to guarantee security. The strongest counter-argument is:", "options": ["Capabilities are simply passwords", "Capabilities can be freely forged by any process", "A capability is an unforgeable token that both identifies an object and confers specific rights to the holder", "Capabilities are identical to ACLs"], "correct": 2, "explanation": "Capability systems invert the ACL model: rights travel with the subject rather than with the object."}, {"id": 6, "text": "Which of the following is a realistic attack or failure mode that Bell-LaPadula is intended to mitigate?", "options": ["It enforces multilevel confidentiality via the simple security property (no read up) and the *-property (no write down)", "It is an integrity model", "It i out Randomization (ASLR) is most accurate in a modern OS security context?", "options": ["ASLR eliminates all memory-corruption vulnerabilities", "ASLR requires the program to be written in a memory-safe language", "By randomising the base addresses of the stack, heap, libraries and executable, ASLR raises the cost of reliable exploitation of memory-corruption bugs", "ASLR is a pure performance optimisation"], "correct": 2, "explanation": "ASLR is a probabilistic defence; it can be bypassed by information leaks or brute force on low-entropy systems."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with Data Execution Prevention (DEP/NX). The best answer is:", "options": ["DEP makes buffer overflows impossible", "DEP encrypts all memory", "Memory pages are marked either writable or executable but not both, preventing the classic 'inject shellcode and jump to it' pattern", "DEP is only relevant to interpreted languages"], "correct": 2, "explanation": "DEP forces attackers toward return-oriented programming or other code-reuse techniques."}, {"id": 3, "text": "Which scenario most clearly demonstrates a failure or misuse of stack canaries?", "options": ["Canaries prevent all heap overflows", "A secret value placed between local buffers and control data is checked on function return; corruption of the canary aborts the process", "Canaries are identical to ASLR", "Canaries require hardware support on every architecture"], "correct": 1, "explanation": "Canaries are a low-cost, high-value defence against sequential stack smashing."}, {"id": 4, "text": "When comparing process isolation via virtual memory with related mechanisms, which distinction is the most security-relevant?", "options": ["Each process possesses a private virtual address space; the MMU and page tables enforce that one process cannot name the memory of another", "Virtual memory is only used for swapping", "Isolation is purely a software convention with no hardwar ion": "Even with decades of mitigations, memory safety remains a dominant source of critical bugs."}]}, {"moduleNumber": 6, "title": "Chapter 6: File System Security", "questions": [{"id": 1, "text": "Which of the following statements about the distinction between authentication of a user and authorisation to a file is most accurate in a modern OS security context?", "options": ["Authentication establishes who the subject is; authorisation decides whether that subject may perform a requested operation on a particular file", "Authorisation is performed only at login", "They are the same operation", "Authentication is sufficient for all access decisions"], "correct": 0, "explanation": "Confusing the two is a frequent source of design errors."}, {"id": 2, "text": "An examiner asks you to identify a subtle limitation or risk associated with LUKS (Linux Unified Key Setup). The best answer is:", "options": ["LUKS can only encrypt individual files, not whole partitions", "LUKS replaces the need for file-system permissions", "LUKS is a network authentication protocol", "It provides a standard on-disk format for encrypted volumes, supporting multiple passphrases and key slots while keeping the bulk data encryption key protected"], "correct": 3, "explanation": "LUKS is the de-facto standard for full-disk encryption on Linux."}, {"id": 3, "text": "Which scenario most clearly demonstrates a failure or misuse of the security limitation of permission bits that are evaluated only at open time?", "options": ["Permission bits are re-evaluated on every read and write", "Open-time checking is sufficient for all security policies", "The problem only exists on network file systems", "If the underlying file is replaced (e.g., via a race or a mount) after the open, the process may continue to access a different object than the one that was authorised"], "correct": 3, "explanation": "Time-of-check-to-time-of-use (TOCTOU) races are a classic issue."}, {"id": 4, "text": "When comparing why s
