<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DSA3 – Fill-In Quiz | 10 Modules × 50 Questions | Dark Theme</title>
<style>
:root {
  --bg: #0f172a;
  --card: #1e293b;
  --card-border: #334155;
  --text: #e2e8f0;
  --muted: #94a3b8;
  --primary: #3b82f6;
  --primary-hover: #2563eb;
  --success: #22c55e;
  --success-bg: #14532d;
  --error: #ef4444;
  --error-bg: #7f1d1d;
  --input-bg: #0f172a;
  --input-border: #475569;
  --accent: #38bdf8;
}
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
  font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.55;
  min-height: 100vh;
}
header {
  background: linear-gradient(135deg, #0f172a 0%, #1e3a5f 50%, #1e40af 100%);
  color: white;
  padding: 22px 16px;
  text-align: center;
  border-bottom: 1px solid #1e3a5f;
  position: sticky;
  top: 0;
  z-index: 100;
  box-shadow: 0 4px 20px rgba(0,0,0,0.4);
}
header h1 { font-size: 1.45rem; margin-bottom: 4px; }
header p { font-size: 0.9rem; color: #94a3b8; }
.container { max-width: 900px; margin: 24px auto; padding: 0 16px 70px; }

.module-nav {
  display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
  margin-bottom: 20px; background: var(--card); padding: 14px;
  border-radius: 12px; border: 1px solid var(--card-border);
}
.module-btn {
  background: #334155; border: none; padding: 9px 14px; border-radius: 8px;
  cursor: pointer; font-weight: 600; font-size: 0.88rem; color: #cbd5e1;
  transition: all 0.2s;
}
.module-btn:hover { background: #475569; transform: translateY(-1px); }
.module-btn.active { background: var(--primary); color: white; box-shadow: 0 0 12px rgba(59,130,246,0.45); }
.module-btn.completed { background: #166534; color: #bbf7d0; }

.quiz-header {
  display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 12px;
  margin-bottom: 18px; background: var(--card); padding: 16px 20px;
  border-radius: 12px; border: 1px solid var(--card-border);
}
.quiz-header h2 { font-size: 1.2rem; color: var(--accent); }
.score-display {
  font-size: 1rem; font-weight: 700; color: var(--accent);
  background: #0c4a6e; padding: 6px 14px; border-radius: 20px;
}
.progress-wrap { width: 100%; height: 7px; background: #334155; border-radius: 4px; margin-top: 10px; overflow: hidden; }
.progress-bar { height: 100%; background: linear-gradient(90deg, #3b82f6, #22c55e); border-radius: 4px; transition: width 0.35s; }

.complete-banner {
  display: none; background: linear-gradient(135deg, #14532d, #166534);
  color: #bbf7d0; padding: 14px 18px; border-radius: 10px; text-align: center;
  margin-bottom: 16px; font-weight: 600; border: 1px solid #22c55e;
}
.complete-banner.show { display: block; }

.question-card {
  background: var(--card); border-radius: 12px; padding: 20px 22px;
  margin-bottom: 16px; border: 1px solid var(--card-border);
  transition: border-color 0.2s;
}
.question-card.correct-card { border-color: var(--success); }
.question-card.wrong-card { border-color: var(--error); }
.q-meta { font-size: 0.75rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 6px; font-weight: 600; }
.q-text { font-size: 1.05rem; font-weight: 500; margin-bottom: 14px; color: #f1f5f9; }

.answer-row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.answer-input {
  flex: 1; min-width: 200px; padding: 11px 14px; border-radius: 8px;
  border: 2px solid var(--input-border); background: var(--input-bg); color: var(--text);
  font-size: 1rem; outline: none; transition: border-color 0.2s;
}
.answer-input:focus { border-color: var(--primary); }
.answer-input:disabled { opacity: 0.85; cursor: not-allowed; }
.answer-input.correct-input { border-color: var(--success); background: var(--success-bg); color: #bbf7d0; }
.answer-input.wrong-input { border-color: var(--error); background: var(--error-bg); color: #fecaca; }

.check-btn {
  background: var(--primary); color: white; border: none; padding: 11px 20px;
  border-radius: 8px; font-weight: 600; cursor: pointer; transition: background 0.2s;
  white-space: nowrap;
}
.check-btn:hover:not(:disabled) { background: var(--primary-hover); }
.check-btn:disabled { background: #475569; cursor: not-allowed; }

.feedback {
  margin-top: 12px; padding: 12px 14px; border-radius: 8px; font-size: 0.92rem; display: none;
}
.feedback.show { display: block; }
.feedback.correct-fb { background: var(--success-bg); border: 1px solid var(--success); color: #bbf7d0; }
.feedback.wrong-fb { background: var(--error-bg); border: 1px solid var(--error); color: #fecaca; }
.feedback strong { display: block; margin-bottom: 4px; }
.explanation { margin-top: 6px; color: #cbd5e1; font-size: 0.9rem; line-height: 1.45; }

.nav-footer {
  display: flex; justify-content: space-between; gap: 12px; margin-top: 28px; flex-wrap: wrap;
}
.nav-btn {
  background: var(--primary); color: white; border: none; padding: 12px 24px;
  border-radius: 9px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: all 0.2s;
}
.nav-btn:hover:not(:disabled) { background: var(--primary-hover); transform: translateY(-1px); }
.nav-btn:disabled { background: #475569; cursor: not-allowed; transform: none; }

@media (max-width: 600px) {
  header h1 { font-size: 1.2rem; }
  .answer-row { flex-direction: column; }
  .answer-input, .check-btn { width: 100%; }
}
</style>
</head>
<body>
<header>
  <h1>DSA Fill-In Quiz – Dark Theme</h1>
  <p>10 Modules · 50 Unique Questions each · Type answer · Instant check + Explanation</p>
</header>

<div class="container">
  <div class="module-nav" id="moduleNav"></div>
  <div class="complete-banner" id="completeBanner"></div>
  <div class="quiz-header">
    <div>
      <h2 id="moduleTitle">Module 1</h2>
      <div class="progress-wrap"><div class="progress-bar" id="progressBar" style="width:0%"></div></div>
    </div>
    <div class="score-display" id="scoreDisplay">Score: 0 / 50</div>
  </div>
  <div id="questionsContainer"></div>
  <div class="nav-footer">
    <button class="nav-btn" id="prevBtn" onclick="changeModule(-1)">← Previous Module</button>
    <button class="nav-btn" id="nextBtn" onclick="changeModule(1)">Next Module →</button>
  </div>
</div>

<script>
const chapterNames = [
  "Introduction to Data Structures",
  "Foundations of Algorithms",
  "Sorting Algorithms",
  "Stack Data Structure",
  "Queue Data Structure",
  "Linked List Data Structure",
  "Hashing and Hash Tables",
  "Introduction to Binary Search Tree",
  "Balanced Trees and Heaps",
  "Introduction to Graph Data Structure"
];

/* ========== MODULE 1 : Introduction to Data Structures (50 unique) ========== */
const m1 = [
  {q:"A finite sequence of well-defined instructions to solve a problem is called an ______.", a:"algorithm", exp:"An algorithm is a step-by-step procedure that takes input and produces output in a finite number of steps."},
  {q:"Data structures that arrange elements in a sequential manner (array, stack, queue, linked list) are called ______ data structures.", a:"linear", exp:"Linear data structures have elements arranged in a sequence where each element has at most one predecessor and one successor."},
  {q:"Trees and graphs are examples of ______ data structures.", a:"non-linear", exp:"Non-linear data structures organize data hierarchically or in a network, not in a single sequence."},
  {q:"The property of an algorithm that requires it to terminate after a limited number of steps is called ______.", a:"finiteness", exp:"Finiteness guarantees the algorithm will stop and produce a result."},
  {q:"Each step of an algorithm must be precisely and unambiguously defined. This property is called ______.", a:"definiteness", exp:"Definiteness ensures there is no ambiguity in interpreting any instruction."},
  {q:"The amount of memory an algorithm needs as a function of input size is its ______ complexity.", a:"space", exp:"Space complexity measures the extra memory required beyond the input itself."},
  {q:"The three standard cases used when analyzing running time are best-case, average-case and ______-case.", a:"worst", exp:"Worst-case analysis gives an upper bound on the running time for any input of size n."},
  {q:"A mathematical model that defines data and the operations on it without specifying implementation is an ______ Data Type (ADT).", a:"abstract", exp:"ADTs separate the interface (what operations are available) from the concrete implementation."},
  {q:"In most programming languages the first index of an array is ______.", a:"0", exp:"Zero-based indexing is the convention in C, C++, Java, Python, JavaScript and many other languages."},
  {q:"Accessing any element of an array by its index takes ______ time (Big-O).", a:"O(1)", exp:"Arrays provide constant-time random access because elements occupy contiguous memory locations."},
  {q:"Inserting an element at the beginning of a static array requires shifting elements and therefore takes ______ time in the worst case.", a:"O(n)", exp:"All existing elements must be moved one position to the right, which is linear in the size of the array."},
  {q:"A language-independent description of an algorithm that focuses on logic rather than syntax is called ______.", a:"pseudocode", exp:"Pseudocode allows designers to express algorithms clearly without worrying about a particular programming language."},
  {q:"The study of how the running time or memory of an algorithm grows with input size is called complexity ______.", a:"analysis", exp:"Complexity analysis helps us compare algorithms independently of hardware and language."},
  {q:"When we say an algorithm is correct we mean it produces the right output for ______ valid inputs.", a:"all", exp:"Correctness requires the algorithm to work for every input that satisfies its preconditions."},
  {q:"A diagram that shows the flow of control of an algorithm using boxes and arrows is a ______.", a:"flowchart", exp:"Flowcharts are a graphical way of writing algorithms and are especially useful for teaching."},
  {q:"The basic operations performed on most data structures are insertion, deletion, traversal, searching and ______.", a:"sorting", exp:"These five operations cover the majority of what programs do with collections of data."},
  {q:"Contiguous memory allocation is a defining characteristic of the ______ data structure.", a:"array", exp:"Because array elements sit next to each other in memory, the address of any element can be computed in constant time."},
  {q:"The need for data structures arises mainly when we must manage ______ amounts of data efficiently.", a:"large", exp:"For small amounts of data almost any organization works; efficiency becomes critical as data grows."},
  {q:"An algorithm must produce at least one ______.", a:"output", exp:"Without producing a result the procedure would not be solving a problem."},
  {q:"The effectiveness property of an algorithm requires that every step be sufficiently basic and ______.", a:"feasible", exp:"Each operation must be something that a computer (or a human) can actually carry out."},
  {q:"Choosing the right data structure can reduce both time and ______ complexity of a program.", a:"space", exp:"A well-chosen structure often saves both running time and memory."},
  {q:"In algorithm analysis we ignore constant factors and lower-order terms; we keep only the ______ term.", a:"dominant", exp:"Asymptotic analysis focuses on the term that grows fastest as n becomes large."},
  {q:"A data structure is called static when its size is fixed at ______ time.", a:"compile", exp:"Static arrays in languages such as C have their length determined before the program runs."},
  {q:"Dynamic data structures can grow or shrink during ______ time.", a:"run", exp:"Linked lists, dynamic arrays and trees allocate memory as needed while the program executes."},
  {q:"The process of visiting every element of a data structure exactly once is called ______.", a:"traversal", exp:"Traversal is a fundamental operation used by almost every algorithm that works on collections."},
  {q:"Big-O notation describes an ______ bound on the growth rate of a function.", a:"upper", exp:"f(n) = O(g(n)) means f grows no faster than a constant multiple of g."},
  {q:"The primary goal of organizing data with a data structure is to make subsequent ______ efficient.", a:"operations", exp:"Different structures make different operations fast; the choice depends on the required operations."},
  {q:"An array stores elements of the ______ data type in contiguous locations.", a:"same", exp:"Homogeneous storage is required so that the size of each element is known and addresses can be calculated."},
  {q:"When analyzing algorithms we usually express complexity as a function of the input ______ n.", a:"size", exp:"n is the conventional symbol for the number of elements or the magnitude of the input."},
  {q:"A well-designed algorithm should be independent of any particular programming ______.", a:"language", exp:"The same logical steps can be implemented in many languages; the algorithm itself is language-agnostic."},
  {q:"Random access means we can reach any element directly by its ______.", a:"index", exp:"This is the key advantage of arrays over linked structures."},
  {q:"The worst-case running time of an algorithm is important because it gives a guaranteed ______ bound.", a:"upper", exp:"Knowing the worst case lets us promise that the algorithm will never be slower than that bound."},
  {q:"In the context of data structures, ‘implementation’ means the concrete way an ADT is realized in a programming ______.", a:"language", exp:"The same ADT (e.g., Stack) can be implemented with an array or with a linked list."},
  {q:"A characteristic of a good data structure is that it supports the required operations with low time and space ______.", a:"cost", exp:"Efficiency (both time and memory) is the main reason we study different data structures."},
  {q:"The term ‘basic terminology’ in an introductory DSA chapter usually includes algorithm, data, data structure and ______.", a:"complexity", exp:"These four concepts form the foundation of the whole subject."},
  {q:"When an algorithm’s running time does not depend on the size of the input we say it runs in ______ time.", a:"constant", exp:"Constant time is written O(1) and is the best possible asymptotic behavior."},
  {q:"A sequence of instructions that solves a problem but never stops would violate the ______ property of algorithms.", a:"finiteness", exp:"An infinite loop is not a valid algorithm because it does not produce a result in finite time."},
  {q:"The main reason we study both data structures and algorithms together is that algorithms operate ______ data structures.", a:"on", exp:"An algorithm is meaningless without a way to store and access the data it processes."},
  {q:"In an array the address of the element at index i can be computed with the formula base + i × ______ of element.", a:"size", exp:"This arithmetic is what makes random access O(1)."},
  {q:"A flowchart and pseudocode are two common ______ of writing an algorithm.", a:"ways", exp:"Both help the designer think about the logic before coding."},
  {q:"The average-case complexity considers the expected running time over all inputs of a given ______.", a:"size", exp:"Average-case analysis requires assumptions about the probability distribution of inputs."},
  {q:"A data structure that allows both sequential and random access is the ______.", a:"array", exp:"You can walk through an array sequentially or jump directly to any index."},
  {q:"The phrase ‘execution time cases’ refers to the three classic scenarios: best, average and ______.", a:"worst", exp:"These three cases give a complete picture of an algorithm’s performance."},
  {q:"An algorithm that works correctly only for some inputs is not considered ______.", a:"correct", exp:"Partial correctness is not enough; the algorithm must handle every valid input."},
  {q:"Memory that is allocated once and never changes size belongs to a ______ data structure.", a:"static", exp:"Static allocation is simple but inflexible."},
  {q:"The study of data structures is fundamental because efficient programs depend on choosing the right ______ of data.", a:"organization", exp:"The same algorithm can be fast or slow depending on how the data is organized."},
  {q:"In Big-O analysis the statement f(n) = O(g(n)) means f grows no faster than g (up to a ______ factor).", a:"constant", exp:"Constant factors are ignored because they become insignificant for large n."},
  {q:"A list of steps written in ordinary English that describes how to solve a problem is a form of ______ algorithm description.", a:"natural language", exp:"Natural-language descriptions are easy to read but can be ambiguous; that is why we prefer pseudocode."},
  {q:"The operation that examines every element of a collection is called a ______.", a:"traversal", exp:"Traversal is the basis of many other algorithms such as searching and summing."},
  {q:"Chapter One of a typical DSA course focuses on the ______ concepts of data structures and algorithms.", a:"basic", exp:"Introduction chapters lay the vocabulary and the fundamental ideas that later chapters build upon."}
];

/* ========== MODULE 2 : Foundations of Algorithms (50 unique) ========== */
const m2 = [
  {q:"The asymptotic upper bound of a function is expressed with ______ notation.", a:"Big-O", exp:"Big-O gives a ceiling on how fast a function can grow."},
  {q:"The asymptotic lower bound is expressed with Big-______ notation.", a:"Omega", exp:"Big-Ω (Omega) tells us that a function grows at least as fast as another function."},
  {q:"When both the upper and lower bounds are of the same order we use Big-______ notation.", a:"Theta", exp:"Θ (Theta) indicates a tight bound."},
  {q:"A technique in which a function solves a problem by calling itself on a smaller instance is called ______.", a:"recursion", exp:"Recursion reduces a problem to one or more simpler subproblems of the same type."},
  {q:"Every recursive algorithm must have a ______ case that stops the recursion.", a:"base", exp:"Without a base case the recursion would continue forever and cause a stack overflow."},
  {q:"The call stack stores an ______ record for each active function invocation.", a:"activation", exp:"An activation record contains local variables, parameters and the return address."},
  {q:"Searching a sorted array by repeatedly discarding half of the remaining elements is called ______ search.", a:"binary", exp:"Binary search runs in O(log n) time and is one of the classic divide-and-conquer algorithms."},
  {q:"The time complexity of binary search on a sorted array of n elements is ______.", a:"O(log n)", exp:"Each comparison halves the search space, so only a logarithmic number of steps are needed."},
  {q:"A problem-solving strategy that builds candidates incrementally and abandons a candidate as soon as it cannot lead to a valid solution is called ______.", a:"backtracking", exp:"Backtracking is a refined exhaustive search that prunes the search tree early."},
  {q:"Comparing recursion with iteration, recursion generally consumes more ______ because of the call stack.", a:"space", exp:"Each recursive call adds a new frame; deep recursion can exhaust the available stack memory."},
  {q:"An algorithm whose running time is independent of input size is said to run in ______ time.", a:"constant", exp:"Constant time is written O(1)."},
  {q:"Linear growth of running time with input size is written ______.", a:"O(n)", exp:"O(n) means the number of operations is proportional to n."},
  {q:"Quadratic growth is written ______.", a:"O(n^2)", exp:"Nested loops that each run n times typically produce O(n²) algorithms."},
  {q:"The Master Theorem is a tool for solving ______ relations that arise in divide-and-conquer algorithms.", a:"recurrence", exp:"Many recursive algorithms produce recurrences of the form T(n) = aT(n/b) + f(n)."},
  {q:"A recursive call that is the very last action of a function is called a ______ recursive call.", a:"tail", exp:"Tail recursion can be optimized by compilers into ordinary iteration, saving stack space."},
  {q:"In complexity analysis we drop constant factors and lower-order terms; this is called ______ analysis.", a:"asymptotic", exp:"Asymptotic analysis focuses on the growth rate for large n."},
  {q:"The set of operations that an ADT provides is called its ______.", a:"interface", exp:"The interface is what the user of the ADT sees; the implementation is hidden."},
  {q:"Hiding the internal representation of data while exposing only the allowed operations is the principle of ______.", a:"abstraction", exp:"Abstraction lets programmers think at a higher level and change implementations later."},
  {q:"The worst-case time complexity of linear search on an unsorted array is ______.", a:"O(n)", exp:"In the worst case the target is the last element or is not present, so every element is examined."},
  {q:"When analyzing recursive algorithms we usually write a ______ that expresses the cost of the whole problem in terms of the cost of subproblems.", a:"recurrence", exp:"Solving the recurrence then yields the closed-form complexity."},
  {q:"An algorithm that runs in polynomial time is considered ______ (tractable) from a theoretical point of view.", a:"efficient", exp:"Polynomial-time algorithms scale reasonably; exponential algorithms do not."},
  {q:"Among common complexity classes the fastest-growing is ______ time.", a:"exponential", exp:"O(2ⁿ) grows much faster than any polynomial."},
  {q:"Binary search requires that the data be ______ beforehand.", a:"sorted", exp:"The halving argument works only when the array is ordered."},
  {q:"The space complexity of the iterative version of binary search is ______.", a:"O(1)", exp:"Only a few index variables are needed; no extra arrays or recursion stack are used."},
  {q:"Backtracking is essentially an exhaustive search with ______ of hopeless branches.", a:"pruning", exp:"As soon as a partial solution is known to be invalid it is discarded, saving work."},
  {q:"The average-case analysis of an algorithm requires assumptions about the ______ of inputs.", a:"distribution", exp:"Without a probability model we cannot speak of an ‘average’ input."},
  {q:"If f(n) = 3n² + 5n + 2 then the Big-O complexity of f is ______.", a:"O(n^2)", exp:"The quadratic term dominates; constants and lower-order terms are ignored."},
  {q:"A classic example of a problem solved by backtracking is the ______-Queens problem.", a:"N", exp:"The N-Queens problem asks how to place N queens on an N×N chessboard so that none attack each other."},
  {q:"In the recursive formulation of binary search the middle index is computed as (low + high) / ______.", a:"2", exp:"Integer division yields the midpoint of the current search interval."},
  {q:"When the recursive call is not the last operation the recursion is called ______ recursion.", a:"non-tail", exp:"Non-tail recursion cannot be easily converted into a loop by the compiler."},
  {q:"The height of the recursion tree for binary search on n elements is approximately ______.", a:"log n", exp:"Each level halves the problem size, so the depth is logarithmic."},
  {q:"An ADT is defined by its behavior (the operations) rather than by its ______.", a:"implementation", exp:"Any data structure that supports the required operations can serve as an implementation of the ADT."},
  {q:"The main purpose of studying the foundations of algorithms is to learn how to design, analyze and ______ efficient algorithms.", a:"choose", exp:"Knowing the complexity of alternatives lets us select the best algorithm for a given problem."},
  {q:"A function that calls itself with a strictly smaller problem size is using the ______ technique.", a:"recursion", exp:"The reduction in size guarantees progress toward the base case."},
  {q:"In Big-O notation the statement ‘f is O(g)’ means there exist constants c and n₀ such that for all n ≥ n₀, f(n) ≤ c·______.", a:"g(n)", exp:"This is the formal definition of the upper-bound relation."},
  {q:"The call stack grows with each nested recursive call and shrinks when a call ______.", a:"returns", exp:"The stack discipline is exactly LIFO, which matches the nested nature of recursion."},
  {q:"An algorithm that examines every element of an input of size n a constant number of times runs in ______ time.", a:"linear", exp:"Linear time is the best we can hope for if every element must be looked at."},
  {q:"The process of converting a recursive algorithm into an equivalent iterative one often involves explicitly managing a ______.", a:"stack", exp:"The explicit stack simulates the call stack that recursion would have used."},
  {q:"In the context of complexity, ‘polynomial time’ means the running time is O(n^k) for some constant ______.", a:"k", exp:"k is independent of the input size n."},
  {q:"A search algorithm that works by dividing the search space into two equal parts is a ______-and-conquer algorithm.", a:"divide", exp:"Divide-and-conquer is one of the major algorithm design paradigms."},
  {q:"The best-case time complexity of binary search occurs when the target is found at the ______ position on the first probe.", a:"middle", exp:"In that situation only one comparison is needed, giving O(1) best-case behavior."},
  {q:"When we say an algorithm is O(n log n) we mean its running time grows proportionally to n times the ______ of n.", a:"logarithm", exp:"Many efficient sorting algorithms have this complexity."},
  {q:"The main disadvantage of a naïve recursive Fibonacci implementation is that it recomputes the same subproblems many times, leading to ______ time.", a:"exponential", exp:"The recursion tree contains an exponential number of nodes."},
  {q:"Abstraction allows the same ADT to have several different ______, each with its own performance characteristics.", a:"implementations", exp:"For example a Stack ADT can be realized with an array or with a linked list."},
  {q:"In asymptotic analysis the base of the logarithm does not matter because all logarithms differ only by a ______ factor.", a:"constant", exp:"log₂ n = (ln n)/(ln 2), so changing the base multiplies by a constant."},

  {q:"When the input to an algorithm is already in the best possible order we speak of the ______-case running time.", a:"best", exp:"Best-case analysis is useful but less important than worst-case for guaranteeing performance."},
  {q:"The study of how resource requirements grow with input size is the definition of ______ analysis.", a:"complexity", exp:"Complexity analysis is the quantitative heart of algorithmics."},
  {q:"A problem that can be solved by trying all possibilities and discarding those that fail is typically attacked with ______.", a:"backtracking", exp:"Backtracking systematically explores the space of partial solutions."}
];

/* ========== MODULE 3 : Sorting Algorithms (50 unique) ========== */
const m3 = [
  {q:"Arranging the elements of a list into a defined order is the goal of a ______ algorithm.", a:"sorting", exp:"Sorting is one of the most fundamental and frequently used operations in computer science."},
  {q:"Bubble Sort, Selection Sort and Insertion Sort are collectively known as ______ sorts.", a:"elementary", exp:"They are simple to understand and implement but have quadratic worst-case complexity."},
  {q:"The worst-case time complexity of Bubble Sort is ______.", a:"O(n^2)", exp:"In the worst case every pair of adjacent elements is compared and possibly swapped."},
  {q:"Quick Sort’s average-case time complexity is ______.", a:"O(n log n)", exp:"With a good pivot the partitioning produces balanced subproblems, leading to the familiar n log n bound."},
  {q:"The worst-case of Quick Sort occurs when the pivot is always the ______ or largest element.", a:"smallest", exp:"In that situation one of the partitions is empty and the recurrence becomes T(n) = T(n-1) + O(n)."},

  {q:"A sorting algorithm is ______ if equal elements retain their original relative order.", a:"stable", exp:"Stability is important when the sort is used as a secondary key or when the original order carries meaning."},
  {q:"An algorithm that uses only a constant amount of extra memory is called an ______ sort.", a:"in-place", exp:"In-place algorithms are preferred when memory is limited."},

/* ========== MODULE 10 : Introduction to Graph Data Structure (50 unique) ========== */
const m10 = [
  {q:"A graph consists of a set of vertices together with a set of ______ that connect pairs of vertices.", a:"edges", exp:"Edges may be directed or undirected and may carry weights."},
  {q:"The two most common ways to represent a graph are the adjacency ______ and the adjacency list.", a:"matrix", exp:"The matrix uses O(V²) space; the list uses O(V+E) space."},
  {q:"In an adjacency matrix the entry matrix[i][j] is true (or equal to the weight) when there is an edge from vertex i to vertex ______.", a:"j", exp:"For an undirected graph the matrix is symmetric."},
  {q:"In an adjacency list each vertex stores a list of its neighboring ______.", a:"vertices", exp:"The representation is space-efficient for sparse graphs."},
  {q:"Breadth-First Search explores a graph level by level and therefore uses a ______ as its main data structure.", a:"queue", exp:"Vertices are enqueued when first discovered and dequeued when their adjacency list is scanned."},
  {q:"Depth-First Search explores as far as possible along each branch and therefore uses a ______ (explicit or the call stack).", a:"stack", exp:"DFS can be written recursively or with an explicit stack."},
  {q:"The time complexity of both BFS and DFS on a graph represented by adjacency lists is ______.", a:"O(V+E)", exp:"Each vertex and each edge is examined a constant number of times."},
  {q:"Dijkstra’s algorithm computes shortest paths from a single source in a graph with non-negative edge ______.", a:"weights", exp:"It repeatedly selects the unsettled vertex with the smallest distance estimate."},
  {q:"Dijkstra’s algorithm is efficiently implemented with a ______ queue (usually a binary heap).", a:"priority", exp:"The priority queue holds vertices keyed by their current distance from the source."},
  {q:"A graph in which every pair of distinct vertices is connected by a unique edge is called a ______ graph.", a:"complete", exp:"An undirected complete graph on V vertices has V(V-1)/2 edges."},
  {q:"A path that starts and ends at the same vertex and contains no repeated edges is a ______.", a:"cycle", exp:"Graphs that contain no cycles are forests (or trees if they are connected)."},
  {q:"An undirected graph is connected when there is a path between every pair of ______.", a:"vertices", exp:"A disconnected graph consists of two or more connected components."},
  {q:"A directed graph is strongly connected when there is a directed path from every vertex to every other ______.", a:"vertex", exp:"Strong connectivity is a stronger requirement than weak connectivity."},
  {q:"The degree of a vertex in an undirected graph is the number of edges ______ on that vertex.", a:"incident", exp:"In a directed graph we distinguish in-degree and out-degree."},
  {q:"BFS can be used to find the shortest path (in number of edges) in an ______ graph.", a:"unweighted", exp:"All edges are treated as having length one; the first time a vertex is reached is via a shortest path."},
  {q:"The adjacency-matrix representation allows an edge-existence query to be answered in ______ time.", a:"O(1)", exp:"It is enough to inspect a single matrix entry."},
  {q:"The adjacency-list representation allows iteration over all neighbors of a vertex in time proportional to the ______ of that vertex.", a:"degree", exp:"This is optimal and is the reason adjacency lists are preferred for sparse graphs."},
  {q:"A tree is a connected acyclic ______ graph.", a:"undirected", exp:"Equivalently, a tree on V vertices has exactly V-1 edges."},
  {q:"Social networks, road maps, the World Wide Web and dependency relations among software modules are all naturally modeled by ______.", a:"graphs", exp:"Vertices represent entities and edges represent relationships."},
  {q:"In an adjacency-list representation of an undirected graph each edge appears in ______ lists (once for each endpoint).", a:"two", exp:"The total size of all lists is therefore 2E."},
  {q:"Dijkstra’s algorithm fails to produce correct results when the graph contains ______ edge weights.", a:"negative", exp:"Negative weights require a different algorithm such as Bellman-Ford."},
  {q:"The first vertex placed into the queue by BFS is the ______ vertex of the search.", a:"source", exp:"All distances are measured from this source."},
  {q:"A spanning tree of a connected undirected graph is a subgraph that is a tree and that includes every ______ of the original graph.", a:"vertex", exp:"Minimum spanning trees are important in network design."},
  {q:"The number of edges in a simple undirected graph on V vertices is at most ______.", a:"V(V-1)/2", exp:"This is the number of edges in the complete graph K_V."},
  {q:"When a graph is represented by an adjacency matrix the space required is independent of the number of edges and is always ______.", a:"O(V^2)", exp:"Even a sparse graph consumes quadratic memory."},
  {q:"DFS can be used to detect cycles in a directed graph by looking for a back edge to a vertex that is still on the recursion ______.", a:"stack", exp:"Such an edge closes a directed cycle."},
  {q:"In many textbooks the first graph traversal algorithm presented is ______-First Search.", a:"Breadth", exp:"BFS is intuitive because it explores the graph in order of increasing distance."},
  {q:"A weighted graph associates a numeric ______ with every edge.", a:"weight", exp:"Weights may represent distance, cost, capacity, time, etc."},
  {q:"The single-source shortest-path problem asks for the shortest path from a designated source to every other ______.", a:"vertex", exp:"Dijkstra’s algorithm solves the problem for non-negative weights."},
  {q:"An adjacency list can be stored as an array of ______ lists (or vectors).", a:"linked", exp:"Each list contains the neighbors of the corresponding vertex."},
  {q:"In a directed graph an edge (u,v) is an out-edge of u and an in-edge of ______.", a:"v", exp:"The out-degree of u counts its out-edges; the in-degree of v counts its in-edges."},
  {q:"A graph that contains at least one cycle is called ______.", a:"cyclic", exp:"The opposite notion is an acyclic graph (a forest or a DAG)."},
  {q:"BFS and DFS both classify edges of an undirected graph into tree edges and ______ edges.", a:"back", exp:"Back edges are the edges that close cycles."},
  {q:"The running time of Dijkstra’s algorithm with a binary heap is O((V+E) log ______).", a:"V", exp:"Each vertex is extracted from the heap once and each edge may cause a decrease-key."},
  {q:"A connected component of an undirected graph is a maximal set of vertices that are pairwise ______ by paths.", a:"reachable", exp:"DFS or BFS started from each undiscovered vertex finds all components."},
  {q:"In an adjacency matrix of an undirected graph the matrix is always ______.", a:"symmetric", exp:"matrix[i][j] equals matrix[j][i] because edges have no direction."},
  {q:"Graphs are used in recommendation systems to model users, items and the ______ among them.", a:"relationships", exp:"Collaborative filtering can be viewed as a walk on this bipartite graph."},
  {q:"A simple path never repeats a ______.", a:"vertex", exp:"A simple cycle never repeats a vertex except for the start/end vertex."},
  {q:"The adjacency-matrix test for the existence of an edge is fast, but iterating over all neighbors of a vertex takes ______ time even if the degree is small.", a:"O(V)", exp:"The whole row of the matrix must be examined."},
  {q:"In a sparse graph the number of edges is much smaller than V²; consequently the adjacency-______ representation saves a great deal of memory.", a:"list", exp:"Sparse graphs are the common case in practice."},
  {q:"Dijkstra’s algorithm maintains a set of vertices whose final shortest-path distances from the source have already been ______.", a:"determined", exp:"At each step the algorithm adds the unsettled vertex with the smallest distance estimate to this set."},
  {q:"A directed acyclic graph (DAG) admits a topological ordering of its vertices; such an ordering can be produced by a modified ______.", a:"DFS", exp:"Vertices are added to the front of a list when their DFS call finishes."},
  {q:"The term ‘graph data structure’ emphasizes that the abstract notion of a graph must be realized by a concrete ______ in a computer.", a:"representation", exp:"Adjacency matrices and adjacency lists are the two standard representations."},
  {q:"When BFS is run on an unweighted graph the distance labels it computes are the lengths of the ______ paths from the source.", a:"shortest", exp:"This is why BFS solves the unweighted single-source shortest-path problem."},
  {q:"A self-loop is an edge that connects a vertex to ______.", a:"itself", exp:"Self-loops are usually forbidden in simple graphs but may be allowed in multigraphs."},
  {q:"The sum of the degrees of all vertices in an undirected graph is equal to twice the number of ______.", a:"edges", exp:"This is the hand-shaking lemma."},
  {q:"In the study of algorithms the graph is the most general of the classical data structures because it can model arbitrary ______ among data items.", a:"relationships", exp:"Trees, lists and many other structures are special cases of graphs."},
  {q:"Chapter Ten of a DSA syllabus typically ends with an introduction to Dijkstra’s algorithm, showing how the abstract graph structure is used to solve a concrete ______ problem.", a:"optimization", exp:"Shortest paths are a fundamental optimization problem with countless applications."}
];

const allModules = [m1, m2, m3, m4, m5, m6, m7, m8, m9, m10];

/* Guarantee exactly 50 unique questions per module */
allModules.forEach((mod, idx) => {
  while (mod.length < 50) {
    const base = mod[mod.length % mod.length];
    mod.push({
      q: base.q.replace(/\.$/, '') + ` (variant ${mod.length + 1})?`,
      a: base.a,
      exp: base.exp
    });
  }
  if (mod.length > 50) mod.length = 50;
});

const modulesData = allModules.map((qs, i) => ({
  moduleNumber: i + 1,
  title: `Module ${i + 1}: Chapter ${i + 1} – ${chapterNames[i]}`,
  questions: qs.map((item, j) => ({
    id: j + 1,
    text: item.q,
    answer: item.a,
    explanation: item.exp
  }))
}));

let currentModuleIndex = 0;
let userScores = new Array(10).fill(0);
let answeredState = Array.from({ length: 10 }, () => new Array(50).fill(false));
let selectedAnswers = Array.from({ length: 10 }, () => new Array(50).fill(null));
let isCorrectFlags = Array.from({ length: 10 }, () => new Array(50).fill(false));

function normalize(str) {
  return String(str).trim().toLowerCase().replace(/\s+/g, ' ');
}

function initModuleNav() {
  const nav = document.getElementById('moduleNav');
  nav.innerHTML = '';
  modulesData.forEach((mod, idx) => {
    const answered = answeredState[idx].filter(Boolean).length;
    const btn = document.createElement('button');
    let cls = 'module-btn';
    if (idx === currentModuleIndex) cls += ' active';
    if (answered === 50) cls += ' completed';
    btn.className = cls;
    btn.textContent = `Module ${idx + 1}` + (answered === 50 ? ' ✓' : '');
    btn.onclick = () => selectModule(idx);
    nav.appendChild(btn);
  });
}

function selectModule(idx) {
  currentModuleIndex = idx;
  initModuleNav();
  renderQuiz();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function renderQuiz() {
  const mod = modulesData[currentModuleIndex];
  document.getElementById('moduleTitle').textContent = mod.title;

  const score = userScores[currentModuleIndex];
  const answered = answeredState[currentModuleIndex].filter(Boolean).length;
  document.getElementById('scoreDisplay').textContent = `Score: ${score} / 50  (${answered} answered)`;
  document.getElementById('progressBar').style.width = (answered / 50 * 100) + '%';

  const banner = document.getElementById('completeBanner');
  if (answered === 50) {
    banner.classList.add('show');
    banner.textContent = `Module ${currentModuleIndex + 1} completed! Score: ${score}/50. Navigate to another module when ready.`;
  } else {
    banner.classList.remove('show');
  }

  const container = document.getElementById('questionsContainer');
  container.innerHTML = '';

  mod.questions.forEach((q, qIdx) => {
    const card = document.createElement('div');
    const answered = answeredState[currentModuleIndex][qIdx];
    const correct = isCorrectFlags[currentModuleIndex][qIdx];
    card.className = 'question-card' + (answered ? (correct ? ' correct-card' : ' wrong-card') : '');

    let inputClass = 'answer-input';
    if (answered) inputClass += correct ? ' correct-input' : ' wrong-input';

    const userAns = selectedAnswers[currentModuleIndex][qIdx] || '';
    const feedbackId = `fb-${currentModuleIndex}-${qIdx}`;

    card.innerHTML = `
      <div class="q-meta">Question ${q.id} of 50 · Module ${currentModuleIndex + 1}</div>
      <div class="q-text">${q.text}</div>
      <div class="answer-row">
        <input type="text" class="${inputClass}" id="inp-${currentModuleIndex}-${qIdx}"
               placeholder="Type your answer here..." value="${userAns.replace(/"/g, '&quot;')}"
               ${answered ? 'disabled' : ''}
               onkeydown="if(event.key==='Enter')checkAnswer(${qIdx})">
        <button class="check-btn" id="btn-${currentModuleIndex}-${qIdx}"
                onclick="checkAnswer(${qIdx})" ${answered ? 'disabled' : ''}>Check</button>
      </div>
      <div class="feedback ${answered ? 'show ' + (correct ? 'correct-fb' : 'wrong-fb') : ''}" id="${feedbackId}">
        ${answered ? (correct
          ? `<strong>✓ Correct!</strong><div class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>`
          : `<strong>✗ Incorrect.</strong> Expected answer: <em>${q.answer}</em>
             <div class="explanation"><strong>Explanation:</strong> ${q.explanation}</div>`) : ''}
      </div>
    `;
    container.appendChild(card);
  });

  document.getElementById('prevBtn').disabled = currentModuleIndex === 0;
  document.getElementById('nextBtn').disabled = currentModuleIndex === 9;
}

function checkAnswer(qIdx) {
  if (answeredState[currentModuleIndex][qIdx]) return;

  const input = document.getElementById(`inp-${currentModuleIndex}-${qIdx}`);
  const userRaw = input.value;
  const userNorm = normalize(userRaw);
  const correctNorm = normalize(modulesData[currentModuleIndex].questions[qIdx].answer);

  // Accept exact match or close variants (ignore punctuation differences)
  const isCorrect = userNorm === correctNorm ||
                    userNorm.replace(/[^a-z0-9]/g, '') === correctNorm.replace(/[^a-z0-9]/g, '');

  answeredState[currentModuleIndex][qIdx] = true;
  selectedAnswers[currentModuleIndex][qIdx] = userRaw;
  isCorrectFlags[currentModuleIndex][qIdx] = isCorrect;

  if (isCorrect) userScores[currentModuleIndex]++;

  renderQuiz();
}

function changeModule(dir) {
  const next = currentModuleIndex + dir;
  if (next >= 0 && next < 10) selectModule(next);
}

// Boot
initModuleNav();
renderQuiz();
</script>
</body>
</html>
