    border-bottom: 2px dashed var(--accent);
    color: var(--accent);

// Normalize answer for comparison
function normalize(s) {
  return s.trim().toLowerCase().replace(/[-_]/g, ' ').replace(/\s+/g, ' ');
}

function isCorrect(userAns, accepted) {
  const u = normalize(userAns);
  if (!u) return false;
  return accepted.some(a => {
    const n = normalize(a);
    return u === n || u.includes(n) || n.includes(u);
  });
}

const state = questions.map(() => ({ answered: false, correct: false }));

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${i}`;
    card.innerHTML = `
      <span class="module-tag m${q.module}">${q.tag}</span>
      <div class="q-text"><span class="q-num">${i + 1}.</span>${q.text.replace('_____', '<span class="blank">_____</span>')}</div>
      <div class="answer-row">
        <input type="text" id="ans${i}" placeholder="Type your answer…" autocomplete="off"
               onkeydown="if(event.key==='Enter'){checkOne(${i});}">
        <button class="btn btn-check" onclick="checkOne(${i})">Check</button>
      </div>
      <div class="hint">Hint: ${q.hint}</div>
      <div class="feedback" id="fb${i}"></div>
    `;
    container.appendChild(card);
  });
}

function checkOne(i) {
  const input = document.getElementById(`ans${i}`);
  const fb = document.getElementById(`fb${i}`);
  const card = document.getElementById(`q${i}`);
  const user = input.value;
  const ok = isCorrect(user, questions[i].answers);

  state[i].answered = true;
  state[i].correct = ok;

  input.classList.remove('marked-correct', 'marked-incorrect');
  card.classList.remove('correct', 'incorrect');

  if (!user.trim()) {
    fb.textContent = 'Please enter an answer.';
    fb.className = 'feedback bad';
    state[i].answered = false;
    updateStats();
    return;
  }

  if (ok) {
    input.classList.add('marked-correct');
    card.classList.add('correct');
    fb.textContent = '✓ Correct!';
    fb.className = 'feedback ok';
  } else {
    input.classList.add('marked-incorrect');
    card.classList.add('incorrect');
    const show = questions[i].answers[0];
    fb.textContent = `✗ Incorrect. Accepted answer: ${show}`;
    fb.className = 'feedback bad';
  }
  updateStats();
}

function checkAll() {
  questions.forEach((_, i) => checkOne(i));
  showFinalScore();
  document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth' });
}

function updateStats() {
  const answered = state.filter(s => s.answered).length;
  const correct = state.filter(s => s.correct).length;
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('correctCount').textContent = correct;
  const pct = answered ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('liveScore').textContent = pct + '%';
  document.getElementById('progressBar').style.width = (answered / 50 * 100) + '%';

  if (answered === 50) showFinalScore();
}

function showFinalScore() {
  const correct = state.filter(s => s.correct).length;
  const pct = Math.round((correct / 50) * 100);
  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('finalDetail').textContent =
    `${correct} out of 50 correct`;

  // Module breakdown
  const mods = {};
  questions.forEach((q, i) => {
    if (!mods[q.module]) mods[q.module] = { total: 0, correct: 0 };
    mods[q.module].total++;
    if (state[i].correct) mods[q.module].correct++;
  });
  const br = document.getElementById('moduleBreakdown');
  br.innerHTML = '';
  for (let m = 1; m <= 6; m++) {
    const d = mods[m];
    const box = document.createElement('div');
    box.className = 'mod-box';
    box.innerHTML = `<strong>${d.correct}/${d.total}</strong>Module ${m}`;
    br.appendChild(box);
  }
  document.getElementById('scorePanel').classList.add('visible');
}

function resetQuiz() {
  state.forEach(s => { s.answered = false; s.correct = false; });
  questions.forEach((_, i) => {
    const input = document.getElementById(`ans${i}`);
    const fb = document.getElementById(`fb${i}`);
    const card = document.getElementById(`q${i}`);
    input.value = '';
    input.classList.remove('marked-correct', 'marked-incorrect');
    card.classList.remove('correct', 'incorrect');
    fb.textContent = '';
    fb.className = 'feedback';
  });
  document.getElementById('scorePanel').classList.remove('visible');
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showUnanswered() {
  for (let i = 0; i < state.length; i++) {
    if (!state[i].answered) {
      document.getElementById(`q${i}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      document.getElementById(`ans${i}`).focus();
      return;
    }
  }
  alert('All questions have been answered!');
}

renderQuiz();
updateStats();
</script>
</body>
</html>
