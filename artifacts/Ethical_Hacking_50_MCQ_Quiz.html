      "Default SNMP community strings"
    ],
    correct: 0
  },
  {
    module: 6,
    tag: "Module 6 · Application Vulnerabilities",
    text: "The most reliable defense against SQL injection is:",
    options: [
      "Relying solely on client-side JavaScript validation",
      "Using parameterized queries (prepared statements) so user input is treated only as data",
      "Disabling the database entirely",
      "Using only GET requests"
    ],
    correct: 1
  }
];

const state = questions.map(() => ({ answered: false, correct: false, selected: null }));

function renderQuiz() {
  const container = document.getElementById('quizContainer');
  container.innerHTML = '';
  questions.forEach((q, i) => {
    const card = document.createElement('div');
    card.className = 'question-card';
    card.id = `q${i}`;
    let optsHtml = q.options.map((opt, j) => `
      <label class="option" id="opt${i}_${j}">
        <input type="radio" name="q${i}" value="${j}" onchange="selectAnswer(${i}, ${j})">
        <span class="opt-label"><strong>${String.fromCharCode(65 + j)}.</strong> ${opt}</span>
      </label>
    `).join('');
    card.innerHTML = `
      <span class="module-tag m${q.module}">${q.tag}</span>
      <div class="q-text"><span class="q-num">${i + 1}.</span>${q.text}</div>
      <div class="options">${optsHtml}</div>
      <div class="feedback" id="fb${i}"></div>
    `;
    container.appendChild(card);
  });
}

function selectAnswer(qIndex, optIndex) {
  const q = questions[qIndex];
  const already = state[qIndex].answered;
  // Allow changing answer only if not yet marked, or always re-mark
  state[qIndex].selected = optIndex;
  state[qIndex].answered = true;
  state[qIndex].correct = (optIndex === q.correct);

  // Visual update
  const card = document.getElementById(`q${qIndex}`);
  const fb = document.getElementById(`fb${qIndex}`);
  card.classList.remove('correct', 'incorrect');
  for (let j = 0; j < q.options.length; j++) {
    const el = document.getElementById(`opt${qIndex}_${j}`);
    el.classList.remove('selected', 'correct-opt', 'wrong-opt', 'disabled');
  }

  // Highlight selection and mark instantly
  const selectedEl = document.getElementById(`opt${qIndex}_${optIndex}`);
  selectedEl.classList.add('selected');

  if (optIndex === q.correct) {
    selectedEl.classList.add('correct-opt');
    card.classList.add('correct');
    fb.textContent = '✓ Correct!';
    fb.className = 'feedback ok';
  } else {
    selectedEl.classList.add('wrong-opt');
    card.classList.add('incorrect');
    const correctEl = document.getElementById(`opt${qIndex}_${q.correct}`);
    correctEl.classList.add('correct-opt');
    fb.textContent = `✗ Incorrect. Correct answer: ${String.fromCharCode(65 + q.correct)}. ${q.options[q.correct]}`;
    fb.className = 'feedback bad';
  }

  // Disable further changes for clarity (optional – comment out to allow re-answering)
  for (let j = 0; j < q.options.length; j++) {
    document.getElementById(`opt${qIndex}_${j}`).classList.add('disabled');
    const inp = document.querySelector(`#opt${qIndex}_${j} input`);
    if (inp) inp.disabled = true;
  }

  updateStats();
}

function checkAll() {
  questions.forEach((q, i) => {
    if (state[i].selected === null) {
      // Leave unanswered
      return;
    }
    // Re-trigger marking
    selectAnswer(i, state[i].selected);
  });
  // Force mark any that somehow weren't
  updateStats();
  showFinalScore();
  document.getElementById('scorePanel').scrollIntoView({ behavior: 'smooth' });
}

function updateStats() {
  const answered = state.filter(s => s.answered).length;
  const correct = state.filter(s => s.correct).length;
  document.getElementById('answeredCount').textContent = answered;
  document.getElementById('correctCount').textContent = correct;
  const pct = answered ? Math.round((correct / answered) * 100) : 0;
  document.getElementById('liveScore').textContent = pct + '%';
  document.getElementById('progressBar').style.width = (answered / 50 * 100) + '%';
  if (answered === 50) showFinalScore();
}

function showFinalScore() {
  const correct = state.filter(s => s.correct).length;
  const pct = Math.round((correct / 50) * 100);
  document.getElementById('finalScore').textContent = pct + '%';
  document.getElementById('finalDetail').textContent = `${correct} out of 50 correct`;

  const mods = {};
  questions.forEach((q, i) => {
    if (!mods[q.module]) mods[q.module] = { total: 0, correct: 0 };
    mods[q.module].total++;
    if (state[i].correct) mods[q.module].correct++;
  });
  const br = document.getElementById('moduleBreakdown');
  br.innerHTML = '';
  for (let m = 1; m <= 6; m++) {
    const d = mods[m] || { total: 0, correct: 0 };
    const box = document.createElement('div');
    box.className = 'mod-box';
    box.innerHTML = `<strong>${d.correct}/${d.total}</strong>Module ${m}`;
    br.appendChild(box);
  }
  document.getElementById('scorePanel').classList.add('visible');
}

function resetQuiz() {
  state.forEach(s => { s.answered = false; s.correct = false; s.selected = null; });
  document.getElementById('scorePanel').classList.remove('visible');
  renderQuiz();
  updateStats();
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function showUnanswered() {
  for (let i = 0; i < state.length; i++) {
    if (!state[i].answered) {
      document.getElementById(`q${i}`).scrollIntoView({ behavior: 'smooth', block: 'center' });
      return;
    }
  }
  alert('All questions have been answered!');
}

renderQuiz();
updateStats();
</script>
</body>
</html>
